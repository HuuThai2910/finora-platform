spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-user
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:15436/finora_user}
    username: ${USER_DB_USERNAME:finora_user}
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  # Spring Security — Keycloak JWT validation
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/finora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/finora/protocol/openid-connect/certs}

  # Redis — OTP storage (TTL 5 phút) và rate limiting (brute-force detection)
  data:
    redis:
      host: ${USER_REDIS_HOST:localhost}
      port: ${USER_REDIS_PORT:6381}
      password: ${USER_REDIS_PASSWORD:}

  # Feign — bước đọc thẻ eKYC ở finora-ai giải QR, đọc MRZ bằng Tesseract, tìm chân dung (YuNet/SFace)
  # và có thể hỏi Gemini điền chỗ trống; AI xử lý tuần tự nên một lần gọi có thể mất vài chục giây.
  cloud:
    openfeign:
      client:
        config:
          ai-ekyc-service:
            connect-timeout: 3000
            read-timeout: 60000

  # Video liveness gửi multipart (≤ 10 MB) hoặc tối đa 20 ảnh tĩnh (≤ 1,5 MB mỗi ảnh).
  # Vượt giới hạn → 413 PAYLOAD_TOO_LARGE (UploadExceptionHandler).
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 40MB

server:
  port: 8085
  tomcat:
    # Đọc nốt phần thân bị từ chối để client nhận được JSON 413 thay vì kết nối bị cắt ngang.
    max-swallow-size: 50MB

management:
  endpoint:
    health:
      # Ai cũng thấy tên và trạng thái từng thành phần; chi tiết chỉ hiện với token ROLE_ADMIN (W3E, D56).
      show-components: always
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # Mọi API cần PostgreSQL; đăng ký/đăng nhập (OTP, giới hạn dò mật khẩu) cần Redis riêng của User.
        # Keycloak dùng chung mọi service nên không vào readiness: Keycloak tắt sẽ rút mọi service khỏi traffic cùng lúc.
        readiness:
          include: readinessState,db,redis

# Keycloak Admin Client — tạo user, gán role, đổi mật khẩu
keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:finora}
    client-id: ${KEYCLOAK_CLIENT_ID:finora-user-client}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

# Mã hóa PII (CCCD, SĐT) — secret key cho HMAC-SHA256 và AES-256-GCM
# Notification service — gọi qua Feign (internal HTTP, không qua gateway)
finora:
  # Pin-token xác nhận thao tác nhạy cảm — khoá HS256 phải GIỐNG NHAU ở finora-user
  # (bên cấp) và payment/investment/loan (bên kiểm). Mặc định chỉ dùng cho máy dev.
  pin:
    token-secret: ${FINORA_PIN_TOKEN_SECRET:dev-only-pin-token-secret-change-me-32b}
    token-ttl: ${FINORA_PIN_TOKEN_TTL:PT3M}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  cic:
    url: ${CIC_SERVICE_URL:http://localhost:9000}
    mapping:
      enabled: ${USER_CIC_MAPPING_ENABLED:false}
      internal-api-key: ${CIC_INTERNAL_API_KEY:}
      worker-delay: ${USER_CIC_MAPPING_WORKER_DELAY:5000}
      batch-size: ${USER_CIC_MAPPING_BATCH_SIZE:20}
      max-attempts: ${USER_CIC_MAPPING_MAX_ATTEMPTS:20}
      lease-duration: ${USER_CIC_MAPPING_LEASE_DURATION:2m}
      initial-retry-delay: ${USER_CIC_MAPPING_INITIAL_RETRY_DELAY:30s}
      max-retry-delay: ${USER_CIC_MAPPING_MAX_RETRY_DELAY:15m}
  # AI service — đọc thẻ (/document) và kiểm tra khuôn mặt (/liveness) của eKYC, chấm điểm tín dụng.
  # Route eKYC chỉ nhận token service account finora-user-client (client role ai:ekyc:ocr, D34/D35).
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 3s
    liveness-read-timeout: 60s
  # eKYC (EKYC-002): điều khoản đồng ý, kho bằng chứng S3 và worker quét dọn.
  ekyc:
    consent:
      version: ekyc-2026-10
      contact-email: ${EKYC_CONSENT_CONTACT_EMAIL:}
      storage-location: ${EKYC_STORAGE_LOCATION_TEXT:hệ thống lưu trữ thử nghiệm của FINORA}
      server-location: ${EKYC_SERVER_LOCATION_TEXT:Malaysia}
      effective-date: ${EKYC_CONSENT_EFFECTIVE_DATE:16/10/2026}
      mentions-gemini: ${EKYC_CONSENT_MENTIONS_GEMINI:true}
    # Tắt mặc định: chưa có kho thì eKYC dừng ở STORAGE_UNAVAILABLE, không xác minh khi thiếu bằng chứng.
    # Dev local: SeaweedFS (docker/docker-compose.yml, profile ekyc) ở http://localhost:9100, path-style.
    # Deploy: Amazon S3 — bỏ trống endpoint và path-style, đặt region của bucket.
    storage:
      enabled: ${EKYC_EVIDENCE_ENABLED:false}
      endpoint: ${EKYC_S3_ENDPOINT:}
      region: ${EKYC_S3_REGION:us-east-1}
      bucket: ${EKYC_S3_BUCKET:finora-ekyc}
      path-style: ${EKYC_S3_PATH_STYLE:false}
      access-key: ${EKYC_S3_ACCESS_KEY:}
      secret-key: ${EKYC_S3_SECRET_KEY:}
      env: ${EKYC_S3_ENV:dev}
      retention-days: ${EKYC_EVIDENCE_RETENTION_DAYS:30}
    sweeper:
      enabled: ${EKYC_SWEEPER_ENABLED:true}
      interval-ms: ${EKYC_SWEEPER_INTERVAL_MS:3600000}
      initial-delay-ms: ${EKYC_SWEEPER_INITIAL_DELAY_MS:300000}
  crypto:
    hmac-secret: ${FINORA_HMAC_SECRET:change-me-in-production-hmac-secret-key-32chars}
    aes-secret: ${FINORA_AES_SECRET:change-me-prod-aes-256-key-32ch!}
  auth:
    cookie:
      domain: ${AUTH_COOKIE_DOMAIN:localhost}
      secure: ${AUTH_COOKIE_SECURE:false}
