# Route dùng khi Gateway chạy trong Docker Compose (profile `docker`).
#
# `application.yml` trỏ tới localhost cho trường hợp chạy trực tiếp trong IDE. Trong
# container, localhost là chính Gateway nên phải gọi service theo tên service của
# Compose. File này chỉ ghi đè phần uri; predicate giữ nguyên theo thứ tự khai báo.
#
# Route payment/blockchain/investment giữ lại cho đủ bản đồ, dù compose demo chưa
# bật ba service đó. Gateway phân giải tên host lúc chuyển tiếp chứ không lúc khởi
# động, nên route thừa không cản Gateway chạy; gọi vào thì nhận lỗi kết nối.
spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: loan-service
            uri: http://loan:8081
            predicates:
              - Path=/api/v1/loans/**,/api/v1/loan-products/**,/api/v1/loan-purposes/**,/api/v1/loan-applications/**,/api/v1/loan-contracts/**,/api/v1/investor/loan-contracts/**,/api/v1/investor/loan-applications/**
          # Phải đứng trước loan-admin-service để đối soát repayment của Payment không bị Loan nuốt mất.
          - id: payment-service
            uri: http://payment:8082
            predicates:
              - Path=/api/v1/wallets/**,/api/v1/transactions/**,/api/v1/repayments/**,/api/v1/admin/repayment-reconciliation/**,/api/v1/admin/disbursement-reconciliation/**,/api/v1/admin/withdrawals/**
          - id: blockchain-service
            uri: http://blockchain:8083
            predicates:
              - Path=/api/v1/blockchain/**
          - id: investment-service
            uri: http://investment:8084
            predicates:
              - Path=/api/v1/market/**,/api/v1/investments/**
          - id: user-auth-service
            uri: http://user:8085
            predicates:
              - Path=/api/v1/auth/**
          - id: user-admin-service
            uri: http://user:8085
            predicates:
              - Path=/api/v1/admin/users/**,/api/v1/admin/staff-roles/**
          - id: user-service
            uri: http://user:8085
            predicates:
              - Path=/api/v1/users/**,/api/v1/kyc/**
          # Loan Service cũng nhận /api/v1/admin/** (loan-products, loan-applications),
          # nên route admin của Loan phải đứng sau user-admin-service để không nuốt
          # /api/v1/admin/users/** và /api/v1/admin/staff-roles/**.
          - id: loan-admin-service
            uri: http://loan:8081
            predicates:
              - Path=/api/v1/admin/**
          - id: ai-service
            uri: http://ai:8000
            predicates:
              - Path=/api/v1/ai/**
          # Profile ghi đè toàn bộ danh sách route nên phải khai báo lại route Notification của bản gốc.
          - id: notification-service
            uri: http://notification:8086
            predicates:
              - Path=/api/v1/notifications/**
