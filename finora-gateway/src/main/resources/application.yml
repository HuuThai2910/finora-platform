spring:
  application:
    name: finora-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: loan-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/loans/**,/api/v1/loan-products/**,/api/v1/loan-purposes/**,/api/v1/loan-applications/**,/api/v1/loan-contracts/**,/api/v1/investor/loan-contracts/**
          - id: payment-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/wallets/**,/api/v1/transactions/**
          - id: blockchain-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/blockchain/**
          - id: investment-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/market/**,/api/v1/investments/**
          - id: user-auth-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/auth/**
          - id: user-admin-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/admin/users/**
          - id: user-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/users/**,/api/v1/kyc/**
          # Loan Service cũng nhận /api/v1/admin/**; đặt sau route admin User để
          # /api/v1/admin/users/** không bị Loan nuốt mất.
          - id: loan-admin-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/admin/**
          - id: ai-service
            uri: http://localhost:8000
            predicates:
              - Path=/api/v1/ai/**

server:
  port: 8080
