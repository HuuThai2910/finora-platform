spring:
  application:
    name: finora-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: loan-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/loans/**,/api/v1/loan-products/**,/api/v1/loan-purposes/**,/api/v1/loan-applications/**,/api/v1/loan-contracts/**,/api/v1/investor/loan-contracts/**,/api/v1/investor/loan-applications/**
          # Route khớp theo thứ tự khai báo: route này phải đứng trước loan-admin-service để
          # /api/v1/admin/repayment-reconciliation/** của Payment không bị Loan nuốt mất.
          - id: payment-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/wallets/**,/api/v1/transactions/**,/api/v1/repayments/**,/api/v1/admin/repayment-reconciliation/**,/api/v1/admin/disbursement-reconciliation/**,/api/v1/admin/withdrawals/**
          - id: blockchain-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/blockchain/**
          - id: investment-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/market/**,/api/v1/investments/**
          - id: user-auth-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/auth/**
          - id: user-admin-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/admin/users/**,/api/v1/admin/staff-roles/**
          - id: user-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/users/**,/api/v1/kyc/**
          # Loan Service cũng nhận /api/v1/admin/**; đặt sau route admin User để
          # /api/v1/admin/users/** và /api/v1/admin/staff-roles/** không bị Loan nuốt mất.
          - id: loan-admin-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/admin/**
          - id: ai-service
            uri: http://localhost:8000
            predicates:
              - Path=/api/v1/ai/**
          - id: notification-service
            uri: http://localhost:8086
            predicates:
              - Path=/api/v1/notifications/**

server:
  port: 8080

management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # Không gộp health của service phía sau: một service tắt không được rút cả Gateway (và mọi service khác) khỏi
        # traffic; mỗi service tự có readiness riêng (W3E, D56).
        readiness:
          include: readinessState
