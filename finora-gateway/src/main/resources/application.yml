spring:
  application:
    name: finora-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: loan-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/loans/**
          - id: payment-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/wallets/**,/api/v1/transactions/**
          - id: blockchain-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/blockchain/**
          - id: investment-service
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/market/**,/api/v1/investments/**
          - id: user-service
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/users/**,/api/v1/kyc/**
          - id: ai-service
            uri: http://localhost:8000
            predicates:
              - Path=/api/v1/ai/**

server:
  port: 8080
