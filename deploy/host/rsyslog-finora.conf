# Chép vào /etc/rsyslog.d/05-finora-docker.conf trên VM rồi `sudo systemctl restart rsyslog`.
#
# Docker (driver syslog trong docker-compose.azure.yml) gửi log mọi container qua UDP 127.0.0.1:514, facility local0.
# Azure Monitor Agent tự thêm cấu hình chuyển local0 sang agent (theo DCR finora-containers-dcr) ở file 10-azuremonitoragent*;
# file 45 dưới đây dừng local0 sau bước đó để log container không ghi trùng vào /var/log/syslog (ổ VM chỉ 32 GB).
module(load="imudp")
input(type="imudp" address="127.0.0.1" port="514")
