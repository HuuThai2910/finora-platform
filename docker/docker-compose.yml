services:
  # ============ CORE INFRASTRUCTURE ============
  keycloak-db:
    profiles: ["core"]
    image: mysql:8.4
    container_name: finora-keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${KEYCLOAK_DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    volumes:
      - keycloak-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u"$${MYSQL_USER}" -D"$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  zookeeper:
    profiles: ["core"]
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: finora-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - finora-network

  kafka:
    profiles: ["core"]
    image: confluentinc/cp-kafka:7.5.0
    container_name: finora-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - finora-network

  keycloak:
    profiles: ["core"]
    image: quay.io/keycloak/keycloak:23.0
    container_name: finora-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    networks:
      - finora-network

  # ============ LOAN OWNED DATABASE ============
  loan-mysql:
    profiles: ["loan"]
    image: mysql:8.4
    container_name: finora-loan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${LOAN_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ${LOAN_DB_NAME:-finora_loan}
      MYSQL_USER: ${LOAN_DB_USERNAME:-finora_loan}
      MYSQL_PASSWORD: "${LOAN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${LOAN_MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - loan-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u"$${MYSQL_USER}" -D"$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ PAYMENT OWNED DATABASE AND CACHE ============
  payment-mysql:
    profiles: ["payment"]
    image: mysql:8.4
    container_name: finora-payment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${PAYMENT_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ${PAYMENT_DB_NAME:-finora_payment}
      MYSQL_USER: ${PAYMENT_DB_USERNAME:-finora_payment}
      MYSQL_PASSWORD: "${PAYMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_MYSQL_HOST_PORT:-13307}:3306"
    volumes:
      - payment-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u"$${MYSQL_USER}" -D"$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  payment-redis:
    profiles: ["payment"]
    image: redis:7-alpine
    container_name: finora-payment-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PAYMENT_REDIS_PASSWORD}"]
    environment:
      PAYMENT_REDIS_PASSWORD: "${PAYMENT_REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - payment-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${PAYMENT_REDIS_PASSWORD}\" redis-cli ping | grep PONG >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ USER OWNED DATABASE ============
  user-mysql:
    profiles: ["user"]
    image: mysql:8.4
    container_name: finora-user-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${USER_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: ${USER_DB_NAME:-finora_user}
      MYSQL_USER: ${USER_DB_USERNAME:-finora_user}
      MYSQL_PASSWORD: "${USER_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${USER_MYSQL_HOST_PORT:-13308}:3306"
    volumes:
      - user-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u"$${MYSQL_USER}" -D"$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ INVESTMENT OWNED DATABASE ============
  investment-mongo:
    profiles: ["investment"]
    image: mongo:7.0
    container_name: finora-investment-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${INVESTMENT_MONGO_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${INVESTMENT_MONGO_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: ${INVESTMENT_DB_NAME:-finora_investment}
      INVESTMENT_DB_USERNAME: ${INVESTMENT_DB_USERNAME:-finora_investment}
      INVESTMENT_DB_PASSWORD: "${INVESTMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${INVESTMENT_MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - investment-mongo-data:/data/db
      - ./mongodb/investment/init.js:/docker-entrypoint-initdb.d/01-create-investment-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${INVESTMENT_DB_USERNAME}"
          --password "$${INVESTMENT_DB_PASSWORD}"
          --authenticationDatabase "$${MONGO_INITDB_DATABASE}"
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APPLICATION SAMPLE ============
  loan:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.java-service
      args:
        SERVICE_MODULE: finora-loan
    image: finora/loan:local
    container_name: finora-loan
    environment:
      LOAN_DB_URL: jdbc:mysql://loan-mysql:3306/${LOAN_DB_NAME:-finora_loan}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      LOAN_DB_USERNAME: ${LOAN_DB_USERNAME:-finora_loan}
      LOAN_DB_PASSWORD: "${LOAN_DB_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8000}
    ports:
      - "127.0.0.1:${LOAN_HOST_PORT:-8081}:8081"
    depends_on:
      loan-mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - finora-network

volumes:
  keycloak-mysql-data:
  loan-mysql-data:
  payment-mysql-data:
  payment-redis-data:
  user-mysql-data:
  investment-mongo-data:

networks:
  finora-network:
    driver: bridge
