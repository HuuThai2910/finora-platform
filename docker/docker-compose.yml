# Profile `apps`: sáu service Java (Loan, Payment, Investment, Notification, Blockchain, Gateway) chạy bằng jar đã build
# (`mvn -pl <module> -am package -DskipTests`), không build image. Mỗi service đọc `.env` của module (DB Neon như khi chạy
# IntelliJ); Compose chỉ đổi các địa chỉ `localhost` trong `.env` sang tên service trong mạng Docker. Lệnh compose của profile
# này cần đủ `--profile demo --profile fineract --profile apps` (Kafka, Keycloak, User/AI và Fineract; Fineract/Blockchain
# dùng Neon). Sửa code thì `stop <service>` trước (container giữ khóa file jar trên Windows), build lại jar rồi `up -d <service>`;
# muốn debug một service bằng IntelliJ thì dừng container của nó trước.
x-finora-app: &finora-app
  image: eclipse-temurin:21-jre-jammy
  profiles: ["apps"]
  restart: unless-stopped
  working_dir: /app
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - finora-network

# Issuer trong JWT là địa chỉ công khai (localhost:8180) còn JWKS/token lấy qua tên nội bộ `keycloak`.
x-finora-app-network: &finora-app-network
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/${KEYCLOAK_REALM:-finora}
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-finora}/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-finora}/protocol/openid-connect/token
  FINERACT_BASE_URL: http://fineract:8443/fineract-provider/api/v1
  AI_SERVICE_URL: http://ai:8000
  USER_SERVICE_URL: http://user:8085
  PAYMENT_SERVICE_URL: http://payment:8082/api/v1

# Healthcheck gọi readiness (W3E); image JRE không có curl nên dùng /dev/tcp của bash.
x-finora-app-ready: &finora-app-ready
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 90s

services:
  # ============ CORE INFRASTRUCTURE ============
  # Kafka chạy KRaft một node cho local/demo. App chạy trong IntelliJ dùng
  # localhost:${KAFKA_HOST_PORT}; app trong Compose dùng kafka:29092.
  kafka:
    profiles: ["kafka", "demo"]
    image: apache/kafka:3.9.1
    restart: unless-stopped
    container_name: finora-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - finora-network

  # One-shot: render realm-finora.json tu template, thay __KEYCLOAK_CLIENT_SECRET__
  # bang gia tri trong docker/.env. Nho vay secret khong nam trong file commit len Git.
  # Keycloak 23 khong tu thay placeholder trong file realm import nen phai render truoc.
  keycloak-realm-init:
    profiles: ["core", "demo"]
    image: alpine:3.20
    container_name: finora-keycloak-realm-init
    environment:
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      KEYCLOAK_INVESTMENT_CLIENT_SECRET: "${KEYCLOAK_INVESTMENT_CLIENT_SECRET}"
      # Client service account của Loan/AI (D34). Chưa có thì render secret ngẫu nhiên để Keycloak vẫn khởi động;
      # docker/keycloak/add-service-clients.sh đặt secret thật và ghi vào .env.
      KEYCLOAK_LOAN_CLIENT_SECRET: "${KEYCLOAK_LOAN_CLIENT_SECRET:-}"
      KEYCLOAK_AI_CLIENT_SECRET: "${KEYCLOAK_AI_CLIENT_SECRET:-}"
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$KEYCLOAK_CLIENT_SECRET" ]; then
          echo "Thieu KEYCLOAK_CLIENT_SECRET trong docker/.env" >&2
          exit 1
        fi
        if [ -z "$$KEYCLOAK_INVESTMENT_CLIENT_SECRET" ]; then
          echo "Thieu KEYCLOAK_INVESTMENT_CLIENT_SECRET trong docker/.env" >&2
          exit 1
        fi
        LOAN_SECRET="$$KEYCLOAK_LOAN_CLIENT_SECRET"
        AI_SECRET="$$KEYCLOAK_AI_CLIENT_SECRET"
        if [ -z "$$LOAN_SECRET" ] || [ -z "$$AI_SECRET" ]; then
          echo "Chua co KEYCLOAK_LOAN_CLIENT_SECRET/KEYCLOAK_AI_CLIENT_SECRET: chay docker/keycloak/add-service-clients.sh" >&2
        fi
        [ -n "$$LOAN_SECRET" ] || LOAN_SECRET="$$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 43)"
        [ -n "$$AI_SECRET" ] || AI_SECRET="$$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 43)"
        sed -e "s|__KEYCLOAK_CLIENT_SECRET__|$$KEYCLOAK_CLIENT_SECRET|g"             -e "s|__KEYCLOAK_INVESTMENT_CLIENT_SECRET__|$$KEYCLOAK_INVESTMENT_CLIENT_SECRET|g"             -e "s|__KEYCLOAK_LOAN_CLIENT_SECRET__|$$LOAN_SECRET|g"             -e "s|__KEYCLOAK_AI_CLIENT_SECRET__|$$AI_SECRET|g"             /template/realm-finora.json > /import/realm-finora.json
        echo "Da render /import/realm-finora.json"
    volumes:
      - ./keycloak/template:/template:ro
      - keycloak-import:/import
    networks:
      - finora-network

  # Keycloak dung PostgreSQL ngoai Compose: host local hoac Neon tuy docker/.env.
  # Dung JDBC URL day du de khong tach host/port/database lap lai trong Compose.
  keycloak:
    profiles: ["core", "demo"]
    image: quay.io/keycloak/keycloak:23.0
    restart: unless-stopped
    container_name: finora-keycloak
    # --import-realm nap realm finora o lan khoi tao dau tien: 3 realm role ROLE_*
    # (composite, keo theo cac client role quyen chi tiet user:profile:*, user:cccd:*,
    # user:admin:*) va confidential client finora-user-client.
    # Realm da ton tai thi Keycloak BO QUA import: doi realm-finora.json xong phai xoa
    # realm cu (hoac DB Keycloak) roi khoi dong lai, neu khong quyen moi khong duoc nap.
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-realm-init:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: "${KEYCLOAK_DB_URL}"
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      # Cố định issuer công khai để JWT không thay đổi theo hostname nội bộ
      # (keycloak:8080) hay hostname phía host (localhost:8180).
      KC_HOSTNAME_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}"
      KC_HOSTNAME_STRICT: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - keycloak-import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - finora-network

  # ============ MAIL SERVER LOCAL (TUY CHON) ============
  # Mailpit bat moi email service gui di va hien thi o web UI, KHONG chuyen tiep ra
  # Internet. Dung de test welcome email / OTP quen mat khau ma khong can Gmail App Password.
  # Bat: --profile mail. Xem thu tai http://localhost:8025
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    container_name: finora-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ E2E FAULT INJECTION (Q13) ============
  # Chỉ bật bằng profile e2e-faults: proxy TCP giữa Payment và Fineract để harness E2E tiêm lỗi mạng (mất phản hồi,
  # mất request). Launcher tạo proxy fineract-payment (cổng 18444 → fineract:8443) khi chạy với -WithToxiproxy.
  toxiproxy:
    profiles: ["e2e-faults"]
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    container_name: finora-toxiproxy
    ports:
      - "127.0.0.1:${TOXIPROXY_API_HOST_PORT:-8474}:8474"
      - "127.0.0.1:${TOXIPROXY_FINERACT_HOST_PORT:-18444}:18444"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - finora-network

  # ============ LOAN OWNED DATABASE (OFFLINE FALLBACK) ============
  loan-postgres:
    profiles: ["loan"]
    image: postgres:17.5-alpine
    restart: unless-stopped
    container_name: finora-loan-postgres
    environment:
      POSTGRES_DB: ${LOAN_DB_NAME:-finora_loan}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOAN_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${LOAN_DB_USERNAME:-finora_loan}
      APP_DB_PASSWORD: "${LOAN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${LOAN_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - loan-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APACHE FINERACT CORE BANKING FIXTURE ============
  fineract-postgres:
    # Chỉ bật thủ công khi cần fallback offline. Luồng chạy hằng ngày dùng hai DB Neon.
    profiles: ["fineract-local-db"]
    image: postgres:18.3
    restart: "no"
    container_name: finora-fineract-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${FINERACT_POSTGRES_ADMIN_PASSWORD}"
      FINERACT_DB_USERNAME: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_DB_PASSWORD: "${FINERACT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${FINERACT_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 lưu data theo thư mục major-version bên dưới mount này.
      - fineract-postgres-data:/var/lib/postgresql
      - ./postgresql/fineract/init-databases.sh:/docker-entrypoint-initdb.d/01-create-fineract-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${FINERACT_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${FINERACT_DB_USERNAME}" -d fineract_tenants -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - finora-network

  fineract:
    profiles: ["fineract"]
    # Image local được build từ binary Apache 1.15.0 đã pin checksum; không dùng latest.
    build:
      context: ./fineract
      dockerfile: Dockerfile
    image: finora/fineract:1.15.0
    restart: unless-stopped
    container_name: finora-fineract
    environment:
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: "jdbc:postgresql://${FINERACT_DB_HOST}:${FINERACT_DB_PORT:-5432}/${FINERACT_TENANTS_DB_NAME:-fineract_tenants}?sslmode=${FINERACT_DB_SSLMODE:-require}"
      FINERACT_HIKARI_USERNAME: "${FINERACT_DB_USERNAME}"
      FINERACT_HIKARI_PASSWORD: "${FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: "${FINERACT_DB_HOST}"
      FINERACT_DEFAULT_TENANTDB_PORT: "${FINERACT_DB_PORT:-5432}"
      FINERACT_DEFAULT_TENANTDB_UID: "${FINERACT_DB_USERNAME}"
      FINERACT_DEFAULT_TENANTDB_PWD: "${FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: "sslmode=${FINERACT_DB_SSLMODE:-require}"
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Asia/Ho_Chi_Minh
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: "${FINERACT_DEFAULT_DB_NAME:-fineract_default}"
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: FINORA Neon Tenant
      FINERACT_DEFAULT_MASTER_PASSWORD: "${FINERACT_DEFAULT_MASTER_PASSWORD:-fineract}"
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: 8443
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      FINERACT_NODE_ID: 1
      SPRING_PROFILES_ACTIVE: test,diagnostics
      # Chỉ dùng cho functional readiness; script không ghi credential ra log.
      FINORA_READINESS_API_USERNAME: ${FINERACT_API_USERNAME:-mifos}
      FINORA_READINESS_API_PASSWORD: "${FINERACT_API_PASSWORD:-password}"
      FINORA_READINESS_TENANT_ID: ${FINERACT_TENANT_ID:-default}
    ports:
      - "127.0.0.1:${FINERACT_HOST_PORT:-18443}:8443"
    healthcheck:
      # Fineract 1.15 khởi tạo Jersey lười ở request API đầu tiên. TCP open chưa có nghĩa là Loan có thể gọi API.
      test: ["CMD", "/usr/local/bin/finora-fineract-readiness"]
      interval: 15s
      timeout: 20s
      # Neon trống lần đầu có hơn 1.800 change-set; direct SSL có thể cần 10–15 phút.
      retries: 80
      start_period: 300s
    networks:
      - finora-network

  # ============ AI CREDIT SCORING API ============
  ai:
    profiles: ["ai", "demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    image: finora/ai:17.0.0-local
    restart: unless-stopped
    container_name: finora-ai
    environment:
      CIC_SERVICE_URL: ${CIC_SERVICE_URL:-https://cic-service-node.vercel.app}
      USER_SERVICE_URL: ${AI_USER_SERVICE_URL:-http://user:8085}
      KEYCLOAK_TOKEN_URL: ${AI_KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/finora/protocol/openid-connect/token}
      # Client riêng của AI (D34): chỉ đọc hồ sơ User, không còn giữ secret finora-user-client (quản trị Keycloak).
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_AI_CLIENT_ID:-finora-ai-client}
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_AI_CLIENT_SECRET:-}"
      # Kiểm access token của request tới AI (D35): issuer cố định theo KC_HOSTNAME_URL, JWKS qua mạng Docker.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/${KEYCLOAK_REALM:-finora}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-finora}/protocol/openid-connect/certs
      FINORA_ENVIRONMENT: ${FINORA_ENVIRONMENT:-local}
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - finora-network

  # ============ eKYC EVIDENCE STORAGE (S3 LOCAL) ============
  # Kho S3 local cho ảnh CCCD/video liveness (EKYC-002). Dùng SeaweedFS (Apache-2.0) vì MinIO đã
  # ngừng phát hành image/binary. Chỉ mở S3 API ở 127.0.0.1:9100 — không dùng 9000 vì trùng CIC.
  # Bật: --profile ekyc. File s3.json (2 tài khoản) được sinh lúc khởi động từ docker/.env, không commit:
  #   ekyc-admin   (SEAWEEDFS_ADMIN_*): toàn quyền, chỉ seaweedfs-init dùng để tạo bucket;
  #   finora-user  (EKYC_S3_*): chỉ Read/Write/List/Tagging trên bucket eKYC.
  # Mã hoá khi lưu bằng -s3.encryptVolumeData; truy cập ẩn danh bị từ chối vì đã khai báo identities.
  seaweedfs:
    profiles: ["ekyc"]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    container_name: finora-seaweedfs
    environment:
      SEAWEEDFS_ADMIN_ACCESS_KEY: "${SEAWEEDFS_ADMIN_ACCESS_KEY:-}"
      SEAWEEDFS_ADMIN_SECRET_KEY: "${SEAWEEDFS_ADMIN_SECRET_KEY:-}"
      EKYC_S3_ACCESS_KEY: "${EKYC_S3_ACCESS_KEY:-}"
      EKYC_S3_SECRET_KEY: "${EKYC_S3_SECRET_KEY:-}"
      EKYC_S3_BUCKET: "${EKYC_S3_BUCKET:-finora-ekyc}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for v in "$$SEAWEEDFS_ADMIN_ACCESS_KEY" "$$SEAWEEDFS_ADMIN_SECRET_KEY" "$$EKYC_S3_ACCESS_KEY" "$$EKYC_S3_SECRET_KEY"; do
          case "$$v" in
            ""|*[!A-Za-z0-9._~+/=-]*)
              echo "Thieu SEAWEEDFS_ADMIN_* hoac EKYC_S3_* trong docker/.env (chi chu, so va . _ ~ + / = -)" >&2
              exit 1;;
          esac
        done
        umask 077
        printf '{"identities":[{"name":"ekyc-admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"finora-user","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read:%s","Write:%s","List:%s","Tagging:%s"]}]}\n' \
          "$$SEAWEEDFS_ADMIN_ACCESS_KEY" "$$SEAWEEDFS_ADMIN_SECRET_KEY" "$$EKYC_S3_ACCESS_KEY" "$$EKYC_S3_SECRET_KEY" \
          "$$EKYC_S3_BUCKET" "$$EKYC_S3_BUCKET" "$$EKYC_S3_BUCKET" "$$EKYC_S3_BUCKET" > /etc/seaweedfs/s3.json
        chown seaweed:seaweed /etc/seaweedfs/s3.json
        # entrypoint gốc của image tự sửa quyền /data rồi hạ xuống user seaweed trước khi chạy weed.
        exec /entrypoint.sh server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.encryptVolumeData -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_HOST_PORT:-9100}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # GET / không kèm chữ ký trả 403 nhưng chứng tỏ cổng S3 đã nhận request.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - finora-network

  # One-shot: tạo bucket bằng tài khoản admin và đặt vòng đời theo tag (pending 1 ngày, final
  # EKYC_EVIDENCE_RETENTION_DAYS ngày). SeaweedFS nhận cấu hình nhưng chưa chắc thực thi lọc theo tag,
  # nên đây chỉ là lớp phòng thủ thêm; worker quét dọn của finora-user mới là nguồn chuẩn cho hạn lưu.
  seaweedfs-init:
    profiles: ["ekyc"]
    image: amazon/aws-cli:2.38.1
    container_name: finora-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: "${SEAWEEDFS_ADMIN_ACCESS_KEY:-}"
      AWS_SECRET_ACCESS_KEY: "${SEAWEEDFS_ADMIN_SECRET_KEY:-}"
      AWS_DEFAULT_REGION: "${EKYC_S3_REGION:-us-east-1}"
      AWS_EC2_METADATA_DISABLED: "true"
      EKYC_S3_BUCKET: "${EKYC_S3_BUCKET:-finora-ekyc}"
      EKYC_EVIDENCE_RETENTION_DAYS: "${EKYC_EVIDENCE_RETENTION_DAYS:-30}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws configure set default.s3.addressing_style path
        S3="--endpoint-url http://seaweedfs:8333"
        i=0
        until aws $$S3 s3api list-buckets >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 60 ]; then echo "SeaweedFS chua san sang sau 2 phut" >&2; exit 1; fi
          sleep 2
        done
        # Bucket đã có (chạy lại init) thì create báo lỗi; head-bucket thành công nghĩa là dùng tiếp.
        aws $$S3 s3api create-bucket --bucket "$$EKYC_S3_BUCKET" >/dev/null 2>&1 \
          || aws $$S3 s3api head-bucket --bucket "$$EKYC_S3_BUCKET"
        printf '{"Rules":[{"ID":"ekyc-pending","Status":"Enabled","Filter":{"Tag":{"Key":"stage","Value":"pending"}},"Expiration":{"Days":1}},{"ID":"ekyc-final","Status":"Enabled","Filter":{"Tag":{"Key":"stage","Value":"final"}},"Expiration":{"Days":%s}}]}' \
          "$$EKYC_EVIDENCE_RETENTION_DAYS" > /tmp/lifecycle.json
        aws $$S3 s3api put-bucket-lifecycle-configuration --bucket "$$EKYC_S3_BUCKET" \
          --lifecycle-configuration file:///tmp/lifecycle.json \
          || echo "Canh bao: khong dat duoc lifecycle theo tag; worker quet don cua finora-user van xoa dung han" >&2
        echo "San sang: bucket $$EKYC_S3_BUCKET"
    networks:
      - finora-network

  # ============ PAYMENT OWNED DATABASE ============
  # Payment không dùng Redis (B23, W3E): đã gỡ container payment-redis. Khai báo volume `payment-redis-data` ở cuối file
  # không còn service nào dùng (Compose không tạo volume không được tham chiếu); xóa được ở lần sửa danh sách volume sau.
  payment-postgres:
    profiles: ["payment"]
    image: postgres:17.5-alpine
    container_name: finora-payment-postgres
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-finora_payment}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PAYMENT_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${PAYMENT_DB_USERNAME:-finora_payment}
      APP_DB_PASSWORD: "${PAYMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_POSTGRES_HOST_PORT:-15434}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ BLOCKCHAIN OWNED DATABASE (OFFLINE FALLBACK) ============
  blockchain-postgres:
    # Chỉ bật thủ công khi cần fallback offline. Blockchain hằng ngày dùng Neon.
    profiles: ["blockchain-local-db"]
    image: postgres:17.5-alpine
    restart: "no"
    container_name: finora-blockchain-postgres
    environment:
      POSTGRES_DB: ${BLOCKCHAIN_DB_NAME:-finora_blockchain}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${BLOCKCHAIN_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${BLOCKCHAIN_DB_USERNAME:-finora_blockchain}
      APP_DB_PASSWORD: "${BLOCKCHAIN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${BLOCKCHAIN_POSTGRES_HOST_PORT:-15435}:5432"
    volumes:
      - blockchain-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - finora-network

  # ============ HYPERLEDGER FABRIC LOCAL (R6, W3D) ============
  # Profile fabric: 1 orderer Raft + peer0 của Org1 (FINORA) và Org2 (kiểm toán), LevelDB, chaincode finora-ledger
  # dạng CCaaS (không mount docker.sock). Mặc định FINORA vẫn dùng ledger MOCK; bật bằng launcher E2E -WithFabric hoặc
  # docker/fabric-network/fabric-network.ps1 -Action Up. Crypto/genesis/package sinh vào thư mục git-ignore.
  # Chỉ gateway của peer0.org1 mở ra 127.0.0.1 cho finora-blockchain chạy trên host.
  fabric-orderer:
    profiles: ["fabric"]
    image: ghcr.io/hyperledger/fabric-orderer:2.5.16
    restart: unless-stopped
    container_name: finora-fabric-orderer
    mem_limit: 256m
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      # Channel participation API: không có system channel, orderer join finora-channel bằng osnadmin.
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: disabled
    volumes:
      - ./fabric-network/crypto-config/ordererOrganizations/finora.local/orderers/orderer.finora.local/msp:/var/hyperledger/orderer/msp:ro
      - ./fabric-network/crypto-config/ordererOrganizations/finora.local/orderers/orderer.finora.local/tls:/var/hyperledger/orderer/tls:ro
      - fabric-orderer-data:/var/hyperledger/production/orderer
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/9443;
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      finora-network:
        aliases:
          - orderer.finora.local

  fabric-peer0-org1:
    profiles: ["fabric"]
    image: ghcr.io/hyperledger/fabric-peer:2.5.16
    restart: unless-stopped
    container_name: finora-fabric-peer0-org1
    mem_limit: 384m
    environment: &fabric-peer-common
      FABRIC_LOGGING_SPEC: INFO
      # core.yaml của chính image nhưng bỏ vm.endpoint (sinh bởi network.sh generate): chỉ dùng builder ccaas.
      FABRIC_CFG_PATH: /var/hyperledger/peercfg
      CORE_PEER_ID: peer0.org1.finora.local
      CORE_PEER_ADDRESS: peer0.org1.finora.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.finora.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.finora.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.finora.local:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /var/hyperledger/peer/msp
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_TLS_CERT_FILE: /var/hyperledger/peer/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /var/hyperledger/peer/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /var/hyperledger/peer/tls/ca.crt
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CORE_METRICS_PROVIDER: disabled
      CORE_CHAINCODE_EXECUTETIMEOUT: 60s
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"peer0org1"}'
    volumes:
      - ./fabric-network/crypto-config/peerOrganizations/org1.finora.local/peers/peer0.org1.finora.local/msp:/var/hyperledger/peer/msp:ro
      - ./fabric-network/crypto-config/peerOrganizations/org1.finora.local/peers/peer0.org1.finora.local/tls:/var/hyperledger/peer/tls:ro
      - ./fabric-network/build/peercfg:/var/hyperledger/peercfg:ro
      - fabric-peer0-org1-data:/var/hyperledger/production
    ports:
      - "127.0.0.1:${FABRIC_PEER0_ORG1_HOST_PORT:-7051}:7051"
    depends_on:
      fabric-orderer:
        condition: service_healthy
    healthcheck: &fabric-peer-health
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/9444;
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      finora-network:
        aliases:
          - peer0.org1.finora.local

  fabric-peer0-org2:
    profiles: ["fabric"]
    image: ghcr.io/hyperledger/fabric-peer:2.5.16
    restart: unless-stopped
    container_name: finora-fabric-peer0-org2
    mem_limit: 384m
    environment:
      <<: *fabric-peer-common
      CORE_PEER_ID: peer0.org2.finora.local
      CORE_PEER_ADDRESS: peer0.org2.finora.local:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.finora.local:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.finora.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.finora.local:9051
      CORE_PEER_LOCALMSPID: Org2MSP
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"peer0org2"}'
    volumes:
      - ./fabric-network/crypto-config/peerOrganizations/org2.finora.local/peers/peer0.org2.finora.local/msp:/var/hyperledger/peer/msp:ro
      - ./fabric-network/crypto-config/peerOrganizations/org2.finora.local/peers/peer0.org2.finora.local/tls:/var/hyperledger/peer/tls:ro
      - ./fabric-network/build/peercfg:/var/hyperledger/peercfg:ro
      - fabric-peer0-org2-data:/var/hyperledger/production
    depends_on:
      fabric-orderer:
        condition: service_healthy
    healthcheck: *fabric-peer-health
    networks:
      finora-network:
        aliases:
          - peer0.org2.finora.local

  # Mỗi tổ chức chạy chaincode riêng của mình; peer gọi tới theo connection.json trong package CCaaS.
  # Đổi mã chaincode thì tăng tag image để `fabric-network.ps1 -Action Up` build lại (1.1.0: thêm NOTE_TRANSFER_DOCUMENT).
  fabric-ccaas-org1:
    profiles: ["fabric"]
    build:
      context: ./fabric-network/chaincode/finora-ledger
    image: finora/fabric-ledger-ccaas:1.1.0
    restart: unless-stopped
    container_name: finora-fabric-ccaas-org1
    mem_limit: 64m
    environment:
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999
      CHAINCODE_ID_FILE: /var/hyperledger/ccaas/package-id
      FINORA_PROOF_WRITER_MSPIDS: Org1MSP
    volumes:
      - ./fabric-network/build/chaincode:/var/hyperledger/ccaas:ro
    networks:
      finora-network:
        aliases:
          - peer0org1-finora-ledger

  fabric-ccaas-org2:
    profiles: ["fabric"]
    image: finora/fabric-ledger-ccaas:1.1.0
    restart: unless-stopped
    container_name: finora-fabric-ccaas-org2
    mem_limit: 64m
    environment:
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999
      CHAINCODE_ID_FILE: /var/hyperledger/ccaas/package-id
      FINORA_PROOF_WRITER_MSPIDS: Org1MSP
    volumes:
      - ./fabric-network/build/chaincode:/var/hyperledger/ccaas:ro
    depends_on:
      - fabric-ccaas-org1
    networks:
      finora-network:
        aliases:
          - peer0org2-finora-ledger

  # Công cụ một lần (profile fabric-tools): cryptogen/configtxgen/osnadmin/peer CLI chạy network.sh.
  fabric-tools:
    profiles: ["fabric-tools"]
    image: ghcr.io/hyperledger/fabric-tools:2.5.16
    entrypoint: ["/bin/bash", "/work/scripts/network.sh"]
    working_dir: /work
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/fabric
      FABRIC_LOGGING_SPEC: WARN
    volumes:
      - ./fabric-network:/work
    networks:
      - finora-network

  # ============ USER OWNED CACHE (PostgreSQL nam tren host) ============
  user-redis:
    profiles: ["user", "demo"]
    image: redis:7-alpine
    restart: unless-stopped
    container_name: finora-user-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${USER_REDIS_PASSWORD:-}"]
    environment:
      USER_REDIS_PASSWORD: "${USER_REDIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:${USER_REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - user-redis-data:/data
    healthcheck:
      # Chay duoc ca khi USER_REDIS_PASSWORD rong (dev) lan khi da dat password.
      test:
        - CMD-SHELL
        - if [ -n "$$USER_REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$USER_REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ USER APPLICATION (DEMO INTEGRATION) ============
  # Database nam ngoai Compose (Neon hoac PostgreSQL host). Profile `user` van
  # chi bat Redis de khong thay doi workflow IntelliJ cu; profile `demo` moi
  # dong goi va chay ca finora-user.
  user:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.java-service
      args:
        SERVICE_MODULE: finora-user
    image: finora/user:local
    restart: unless-stopped
    container_name: finora-user
    environment:
      USER_DB_URL: "${USER_DB_URL}"
      USER_DB_USERNAME: "${USER_DB_USERNAME}"
      USER_DB_PASSWORD: "${USER_DB_PASSWORD}"
      USER_REDIS_HOST: user-redis
      USER_REDIS_PORT: "6379"
      USER_REDIS_PASSWORD: "${USER_REDIS_PASSWORD:-}"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-finora}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-finora-user-client}
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      # So khớp issuer công khai trong JWT; JWKS vẫn đi qua DNS nội bộ Docker.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/${KEYCLOAK_REALM:-finora}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-finora}/protocol/openid-connect/certs
      AI_SERVICE_URL: http://ai:8000
      # Bằng chứng eKYC: bật cùng --profile ekyc (SeaweedFS trong cùng mạng Docker).
      EKYC_EVIDENCE_ENABLED: "${EKYC_EVIDENCE_ENABLED:-false}"
      EKYC_S3_ENDPOINT: http://seaweedfs:8333
      EKYC_S3_PATH_STYLE: "true"
      EKYC_S3_REGION: "${EKYC_S3_REGION:-us-east-1}"
      EKYC_S3_BUCKET: "${EKYC_S3_BUCKET:-finora-ekyc}"
      EKYC_S3_ACCESS_KEY: "${EKYC_S3_ACCESS_KEY:-}"
      EKYC_S3_SECRET_KEY: "${EKYC_S3_SECRET_KEY:-}"
      EKYC_S3_ENV: "${EKYC_S3_ENV:-dev}"
      EKYC_EVIDENCE_RETENTION_DAYS: "${EKYC_EVIDENCE_RETENTION_DAYS:-30}"
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://host.docker.internal:8086}
      CIC_SERVICE_URL: ${CIC_SERVICE_URL:-https://cic-service-node.vercel.app}
      USER_CIC_MAPPING_ENABLED: "${USER_CIC_MAPPING_ENABLED:-false}"
      CIC_INTERNAL_API_KEY: "${CIC_INTERNAL_API_KEY}"
      FINORA_AES_SECRET: "${FINORA_AES_SECRET}"
      FINORA_HMAC_SECRET: "${FINORA_HMAC_SECRET}"
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-localhost}
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${USER_HOST_PORT:-8085}:8085"
    depends_on:
      keycloak:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    healthcheck:
      # Readiness của actuator (PostgreSQL + Redis User), không chỉ kiểm cổng mở (W3E, D56). Image JRE không có curl
      # nên gửi HTTP bằng /dev/tcp của bash (eclipse-temurin jammy có bash). Tomcat trả "HTTP/1.1 200 " không reason.
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8085;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - finora-network

  # ============ INVESTMENT OWNED DATABASE ============
  investment-postgres:
    profiles: ["investment"]
    image: postgres:17.5-alpine
    container_name: finora-investment-postgres
    environment:
      POSTGRES_DB: ${INVESTMENT_DB_NAME:-finora_investment}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${INVESTMENT_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${INVESTMENT_DB_USERNAME:-finora_investment}
      APP_DB_PASSWORD: "${INVESTMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${INVESTMENT_POSTGRES_HOST_PORT:-15437}:5432"
    volumes:
      - investment-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ NOTIFICATION OWNED DATABASE ============
  notification-postgres:
    profiles: ["notification"]
    image: postgres:17.5-alpine
    container_name: finora-notification-postgres
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-finora_notification}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${NOTIFICATION_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-finora_notification}
      APP_DB_PASSWORD: "${NOTIFICATION_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${NOTIFICATION_POSTGRES_HOST_PORT:-15438}:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APPLICATIONS (profile apps) ============
  loan:
    <<: *finora-app
    container_name: finora-loan
    command: ["java", "-Xmx320m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
    volumes:
      - ../finora-loan/target/finora-loan-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    env_file: ../finora-loan/.env
    environment:
      <<: *finora-app-network
      SPRING_PROFILES_ACTIVE: local
      # D85: mặc định giả lập như stack E2E để test UI bằng tài khoản không eKYC, ghi đè `.env` của module. Đổi trong
      # docker/.env rồi `up -d loan`: APPS_SIGNATURE_PROVIDER=VNPT_SMART_CA ký SmartCA UAT (VNPT_SMARTCA_* lấy từ
      # finora-loan/.env), APPS_BORROWER_PROFILE_PROVIDER=user đọc eKYC thật của User.
      FINORA_SIGNATURE_PROVIDER: ${APPS_SIGNATURE_PROVIDER:-MOCK}
      FINORA_BORROWER_PROFILE_PROVIDER: ${APPS_BORROWER_PROFILE_PROVIDER:-mock}
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *finora-app-ready
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8081;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"

  payment:
    <<: *finora-app
    container_name: finora-payment
    command: ["java", "-Xmx256m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
    volumes:
      - ../finora-payment/target/finora-payment-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    env_file: ../finora-payment/.env
    environment:
      <<: *finora-app-network
      # Provider payout giả lập gọi lại chính Payment qua tên service (W3B).
      PAYMENT_MOCK_PAYOUT_CALLBACK_URL: http://payment:8082/api/v1/wallets/callbacks/mock-payout
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *finora-app-ready
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8082;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"

  investment:
    <<: *finora-app
    container_name: finora-investment
    command: ["java", "-Xmx256m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
    volumes:
      - ../finora-investment/target/finora-investment-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    env_file: ../finora-investment/.env
    environment:
      <<: *finora-app-network
      # D85: nhà đầu tư test không eKYC vẫn đầu tư được; Auto-Invest tắt để quy tắc có sẵn trên Neon không tự góp vốn
      # rồi thành bên phải ký. Đổi bằng APPS_INVESTMENT_REQUIRE_EKYC / APPS_INVESTMENT_AUTO_INVEST_ENABLED.
      INVESTMENT_REQUIRE_EKYC: ${APPS_INVESTMENT_REQUIRE_EKYC:-false}
      INVESTMENT_AUTO_INVEST_ENABLED: ${APPS_INVESTMENT_AUTO_INVEST_ENABLED:-false}
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *finora-app-ready
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8084;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"

  notification:
    <<: *finora-app
    container_name: finora-notification
    command: ["java", "-Xmx192m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
    volumes:
      - ../finora-notification/target/finora-notification-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    env_file: ../finora-notification/.env
    environment:
      <<: *finora-app-network
      # Máy chủ mail (Mailpit hoặc SMTP) chạy trên máy: `.env` ghi localhost.
      MAIL_HOST: host.docker.internal
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      <<: *finora-app-ready
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8086;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"

  blockchain:
    <<: *finora-app
    container_name: finora-blockchain
    # 256m như launcher -WithFabric: gRPC/Netty của Fabric Gateway cần thêm bộ nhớ so với ledger MOCK.
    command: ["java", "-Xmx256m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
    volumes:
      - ../finora-blockchain/target/finora-blockchain-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
      # Danh tính Fabric do docker/fabric-network/fabric-network.ps1 sinh (git-ignore); chỉ được đọc khi provider là Fabric.
      - ./fabric-network:/fabric-network:ro
    environment:
      <<: *finora-app-network
      BLOCKCHAIN_DB_URL: "${BLOCKCHAIN_DB_URL}"
      BLOCKCHAIN_DB_USERNAME: "${BLOCKCHAIN_DB_USERNAME}"
      BLOCKCHAIN_DB_PASSWORD: "${BLOCKCHAIN_DB_PASSWORD}"
      # Blockchain không có .env; mặc định listener/worker tắt nên bật ở đây để proof được tạo (ledger MOCK, R6).
      BLOCKCHAIN_KAFKA_LISTENER_ENABLED: "true"
      BLOCKCHAIN_PROOF_WORKER_ENABLED: "true"
      BLOCKCHAIN_PROOF_PROVIDER: ${BLOCKCHAIN_PROOF_PROVIDER:-MOCK}
      # D86: BLOCKCHAIN_PROOF_PROVIDER=HYPERLEDGER_FABRIC trong docker/.env ghi proof lên mạng Fabric local (dựng trước bằng
      # fabric-network.ps1 -Action Up). Peer cùng mạng finora-network qua alias đúng tên chứng thư TLS; job đối soát tự bỏ
      # qua khi provider là MOCK.
      BLOCKCHAIN_PROOF_RECONCILIATION_ENABLED: "true"
      FABRIC_PEER_ENDPOINT: peer0.org1.finora.local:7051
      FABRIC_CERT_PATH: /fabric-network/crypto-config/peerOrganizations/org1.finora.local/users/User1@org1.finora.local/msp/signcerts/User1@org1.finora.local-cert.pem
      FABRIC_KEY_PATH: /fabric-network/crypto-config/peerOrganizations/org1.finora.local/users/User1@org1.finora.local/msp/keystore/priv_sk
      FABRIC_TLS_CERT_PATH: /fabric-network/crypto-config/peerOrganizations/org1.finora.local/peers/peer0.org1.finora.local/tls/ca.crt
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *finora-app-ready
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8083;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"

  gateway:
    <<: *finora-app
    container_name: finora-gateway
    command: ["java", "-Xmx160m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
    volumes:
      - ../finora-gateway/target/finora-gateway-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      # application-docker.yml trỏ route tới tên service trong mạng Docker (user, ai, loan, payment, ...).
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *finora-app-ready
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q ' 200'"

volumes:
  kafka-data:
  keycloak-import:
  loan-postgres-data:
  fineract-postgres-data:
  payment-postgres-data:
  blockchain-postgres-data:
  fabric-orderer-data:
  fabric-peer0-org1-data:
  fabric-peer0-org2-data:
  payment-redis-data:
  user-redis-data:
  investment-postgres-data:
  notification-postgres-data:
  seaweedfs-data:

networks:
  finora-network:
    driver: bridge
