services:
  # ============ CORE INFRASTRUCTURE ============
  keycloak-db:
    profiles: ["core"]
    image: postgres:17.5-alpine
    container_name: finora-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${KEYCLOAK_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      APP_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  keycloak:
    profiles: ["core"]
    image: quay.io/keycloak/keycloak:23.0
    container_name: finora-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    networks:
      - finora-network

  # ============ LOAN OWNED DATABASE (OFFLINE FALLBACK) ============
  loan-postgres:
    profiles: ["loan"]
    image: postgres:17.5-alpine
    restart: unless-stopped
    container_name: finora-loan-postgres
    environment:
      POSTGRES_DB: ${LOAN_DB_NAME:-finora_loan}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOAN_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${LOAN_DB_USERNAME:-finora_loan}
      APP_DB_PASSWORD: "${LOAN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${LOAN_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - loan-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APACHE FINERACT CORE BANKING FIXTURE ============
  fineract-postgres:
    profiles: ["fineract"]
    image: postgres:18.3
    # Sau lần khởi tạo đầu, container tự chạy lại khi Docker Desktop khởi động.
    restart: unless-stopped
    container_name: finora-fineract-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${FINERACT_POSTGRES_ADMIN_PASSWORD}"
      FINERACT_DB_USERNAME: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_DB_PASSWORD: "${FINERACT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${FINERACT_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 lưu data theo thư mục major-version bên dưới mount này.
      - fineract-postgres-data:/var/lib/postgresql
      - ./postgresql/fineract/init-databases.sh:/docker-entrypoint-initdb.d/01-create-fineract-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${FINERACT_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${FINERACT_DB_USERNAME}" -d fineract_tenants -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - finora-network

  fineract:
    profiles: ["fineract"]
    # Image local được build từ binary Apache 1.15.0 đã pin checksum; không dùng latest.
    build:
      context: ./fineract
      dockerfile: Dockerfile
    image: finora/fineract:1.15.0
    # Fineract chỉ tự chạy sau khi PostgreSQL riêng của nó healthy.
    restart: unless-stopped
    container_name: finora-fineract
    depends_on:
      fineract-postgres:
        condition: service_healthy
    environment:
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://fineract-postgres:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_HIKARI_PASSWORD: "${FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: fineract-postgres
      FINERACT_DEFAULT_TENANTDB_PORT: 5432
      FINERACT_DEFAULT_TENANTDB_UID: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_DEFAULT_TENANTDB_PWD: "${FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Asia/Ho_Chi_Minh
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: FINORA Local Tenant
      FINERACT_DEFAULT_MASTER_PASSWORD: "${FINERACT_DEFAULT_MASTER_PASSWORD:-fineract}"
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: 8443
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      FINERACT_NODE_ID: 1
      SPRING_PROFILES_ACTIVE: test,diagnostics
      # Chỉ dùng cho functional readiness; script không ghi credential ra log.
      FINORA_READINESS_API_USERNAME: ${FINERACT_API_USERNAME:-mifos}
      FINORA_READINESS_API_PASSWORD: "${FINERACT_API_PASSWORD:-password}"
      FINORA_READINESS_TENANT_ID: ${FINERACT_TENANT_ID:-default}
    ports:
      - "127.0.0.1:${FINERACT_HOST_PORT:-18443}:8443"
    healthcheck:
      # Fineract 1.15 khởi tạo Jersey lười ở request API đầu tiên. TCP open chưa có nghĩa là Loan có thể gọi API.
      test: ["CMD", "/usr/local/bin/finora-fineract-readiness"]
      interval: 15s
      timeout: 20s
      retries: 40
      start_period: 180s
    networks:
      - finora-network

  # ============ AI CREDIT SCORING API ============
  ai:
    profiles: ["ai"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    image: finora/ai:10.0.0-local
    restart: unless-stopped
    container_name: finora-ai
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - finora-network

  # ============ PAYMENT OWNED DATABASE AND CACHE ============
  payment-postgres:
    profiles: ["payment"]
    image: postgres:17.5-alpine
    container_name: finora-payment-postgres
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-finora_payment}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PAYMENT_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${PAYMENT_DB_USERNAME:-finora_payment}
      APP_DB_PASSWORD: "${PAYMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_POSTGRES_HOST_PORT:-15434}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  payment-redis:
    profiles: ["payment"]
    image: redis:7-alpine
    container_name: finora-payment-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PAYMENT_REDIS_PASSWORD}"]
    environment:
      PAYMENT_REDIS_PASSWORD: "${PAYMENT_REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - payment-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${PAYMENT_REDIS_PASSWORD}\" redis-cli ping | grep PONG >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ BLOCKCHAIN OWNED DATABASE (OFFLINE FALLBACK) ============
  blockchain-postgres:
    profiles: ["blockchain"]
    image: postgres:17.5-alpine
    container_name: finora-blockchain-postgres
    environment:
      POSTGRES_DB: ${BLOCKCHAIN_DB_NAME:-finora_blockchain}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${BLOCKCHAIN_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${BLOCKCHAIN_DB_USERNAME:-finora_blockchain}
      APP_DB_PASSWORD: "${BLOCKCHAIN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${BLOCKCHAIN_POSTGRES_HOST_PORT:-15435}:5432"
    volumes:
      - blockchain-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - finora-network

  # ============ USER OWNED DATABASE & CACHE ============
  user-redis:
    profiles: ["user"]
    image: redis:7-alpine
    container_name: finora-user-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${USER_REDIS_PASSWORD:-}"]
    environment:
      USER_REDIS_PASSWORD: "${USER_REDIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:${USER_REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - user-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  user-postgres:
    profiles: ["user"]
    image: postgres:17.5-alpine
    container_name: finora-user-postgres
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-finora_user}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${USER_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${USER_DB_USERNAME:-finora_user}
      APP_DB_PASSWORD: "${USER_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${USER_POSTGRES_HOST_PORT:-15436}:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ INVESTMENT OWNED DATABASE ============
  investment-postgres:
    profiles: ["investment"]
    image: postgres:17.5-alpine
    container_name: finora-investment-postgres
    environment:
      POSTGRES_DB: ${INVESTMENT_DB_NAME:-finora_investment}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${INVESTMENT_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${INVESTMENT_DB_USERNAME:-finora_investment}
      APP_DB_PASSWORD: "${INVESTMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${INVESTMENT_POSTGRES_HOST_PORT:-15437}:5432"
    volumes:
      - investment-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APPLICATION SAMPLE ============
  loan:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.java-service
      args:
        SERVICE_MODULE: finora-loan
    image: finora/loan:local
    container_name: finora-loan
    environment:
      LOAN_DB_URL: jdbc:postgresql://loan-postgres:5432/${LOAN_DB_NAME:-finora_loan}
      LOAN_DB_USERNAME: ${LOAN_DB_USERNAME:-finora_loan}
      LOAN_DB_PASSWORD: "${LOAN_DB_PASSWORD}"
      FINERACT_BASE_URL: http://fineract:8443/fineract-provider/api/v1
      FINERACT_API_USERNAME: ${FINERACT_API_USERNAME:-mifos}
      FINERACT_API_PASSWORD: "${FINERACT_API_PASSWORD:-password}"
      FINERACT_PREVIEW_CLIENT_EXTERNAL_ID: ${FINERACT_PREVIEW_CLIENT_EXTERNAL_ID:-FINORA-PREVIEW-CLIENT}
      AI_SERVICE_URL: http://ai:8000
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "127.0.0.1:${LOAN_HOST_PORT:-8081}:8081"
    depends_on:
      loan-postgres:
        condition: service_healthy
    networks:
      - finora-network

volumes:
  keycloak-postgres-data:
  loan-postgres-data:
  fineract-postgres-data:
  payment-postgres-data:
  blockchain-postgres-data:
  payment-redis-data:
  user-redis-data:
  user-postgres-data:
  investment-postgres-data:

networks:
  finora-network:
    driver: bridge
