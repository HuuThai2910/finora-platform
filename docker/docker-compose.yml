services:
  # ============ CORE INFRASTRUCTURE ============
  # One-shot: render realm-finora.json tu template, thay __KEYCLOAK_CLIENT_SECRET__
  # bang gia tri trong docker/.env. Nho vay secret khong nam trong file commit len Git.
  # Keycloak 23 khong tu thay placeholder trong file realm import nen phai render truoc.
  keycloak-realm-init:
    profiles: ["core", "demo"]
    image: alpine:3.20
    container_name: finora-keycloak-realm-init
    environment:
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$KEYCLOAK_CLIENT_SECRET" ]; then
          echo "Thieu KEYCLOAK_CLIENT_SECRET trong docker/.env" >&2
          exit 1
        fi
        sed "s|__KEYCLOAK_CLIENT_SECRET__|$$KEYCLOAK_CLIENT_SECRET|g"           /template/realm-finora.json > /import/realm-finora.json
        echo "Da render /import/realm-finora.json"
    volumes:
      - ./keycloak/template:/template:ro
      - keycloak-import:/import
    networks:
      - finora-network

  # Keycloak dung PostgreSQL ngoai Compose: host local hoac Neon tuy docker/.env.
  # Dung JDBC URL day du de khong tach host/port/database lap lai trong Compose.
  keycloak:
    profiles: ["core", "demo"]
    image: quay.io/keycloak/keycloak:23.0
    restart: unless-stopped
    container_name: finora-keycloak
    # --import-realm nap realm finora o lan khoi tao dau tien: 3 realm role ROLE_*
    # (composite, keo theo cac client role quyen chi tiet user:profile:*, user:cccd:*,
    # user:admin:*) va confidential client finora-user-client.
    # Realm da ton tai thi Keycloak BO QUA import: doi realm-finora.json xong phai xoa
    # realm cu (hoac DB Keycloak) roi khoi dong lai, neu khong quyen moi khong duoc nap.
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-realm-init:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_DB: postgres
      KC_DB_URL: "${KEYCLOAK_DB_URL}"
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      # Cố định issuer công khai để JWT không thay đổi theo hostname nội bộ
      # (keycloak:8080) hay hostname phía host (localhost:8180).
      KC_HOSTNAME_URL: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}"
      KC_HOSTNAME_STRICT: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - keycloak-import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - finora-network

  # ============ MAIL SERVER LOCAL (TUY CHON) ============
  # Mailpit bat moi email service gui di va hien thi o web UI, KHONG chuyen tiep ra
  # Internet. Dung de test welcome email / OTP quen mat khau ma khong can Gmail App Password.
  # Bat: --profile mail. Xem thu tai http://localhost:8025
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    container_name: finora-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ LOAN OWNED DATABASE (OFFLINE FALLBACK) ============
  loan-postgres:
    profiles: ["loan"]
    image: postgres:17.5-alpine
    restart: unless-stopped
    container_name: finora-loan-postgres
    environment:
      POSTGRES_DB: ${LOAN_DB_NAME:-finora_loan}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOAN_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${LOAN_DB_USERNAME:-finora_loan}
      APP_DB_PASSWORD: "${LOAN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${LOAN_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - loan-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APACHE FINERACT CORE BANKING FIXTURE ============
  fineract-postgres:
    profiles: ["fineract"]
    image: postgres:18.3
    # Sau lần khởi tạo đầu, container tự chạy lại khi Docker Desktop khởi động.
    restart: unless-stopped
    container_name: finora-fineract-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${FINERACT_POSTGRES_ADMIN_PASSWORD}"
      FINERACT_DB_USERNAME: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_DB_PASSWORD: "${FINERACT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${FINERACT_POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 lưu data theo thư mục major-version bên dưới mount này.
      - fineract-postgres-data:/var/lib/postgresql
      - ./postgresql/fineract/init-databases.sh:/docker-entrypoint-initdb.d/01-create-fineract-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${FINERACT_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${FINERACT_DB_USERNAME}" -d fineract_tenants -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - finora-network

  fineract:
    profiles: ["fineract"]
    # Image local được build từ binary Apache 1.15.0 đã pin checksum; không dùng latest.
    build:
      context: ./fineract
      dockerfile: Dockerfile
    image: finora/fineract:1.15.0
    # Fineract chỉ tự chạy sau khi PostgreSQL riêng của nó healthy.
    restart: unless-stopped
    container_name: finora-fineract
    depends_on:
      fineract-postgres:
        condition: service_healthy
    environment:
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://fineract-postgres:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_HIKARI_PASSWORD: "${FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: fineract-postgres
      FINERACT_DEFAULT_TENANTDB_PORT: 5432
      FINERACT_DEFAULT_TENANTDB_UID: ${FINERACT_DB_USERNAME:-fineract}
      FINERACT_DEFAULT_TENANTDB_PWD: "${FINERACT_DB_PASSWORD}"
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: Asia/Ho_Chi_Minh
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: FINORA Local Tenant
      FINERACT_DEFAULT_MASTER_PASSWORD: "${FINERACT_DEFAULT_MASTER_PASSWORD:-fineract}"
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: 8443
      FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      FINERACT_NODE_ID: 1
      SPRING_PROFILES_ACTIVE: test,diagnostics
      # Chỉ dùng cho functional readiness; script không ghi credential ra log.
      FINORA_READINESS_API_USERNAME: ${FINERACT_API_USERNAME:-mifos}
      FINORA_READINESS_API_PASSWORD: "${FINERACT_API_PASSWORD:-password}"
      FINORA_READINESS_TENANT_ID: ${FINERACT_TENANT_ID:-default}
    ports:
      - "127.0.0.1:${FINERACT_HOST_PORT:-18443}:8443"
    healthcheck:
      # Fineract 1.15 khởi tạo Jersey lười ở request API đầu tiên. TCP open chưa có nghĩa là Loan có thể gọi API.
      test: ["CMD", "/usr/local/bin/finora-fineract-readiness"]
      interval: 15s
      timeout: 20s
      retries: 40
      start_period: 180s
    networks:
      - finora-network

  # ============ AI CREDIT SCORING API ============
  ai:
    profiles: ["ai", "demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    image: finora/ai:17.0.0-local
    restart: unless-stopped
    container_name: finora-ai
    environment:
      CIC_SERVICE_URL: ${CIC_SERVICE_URL:-http://cic:9000}
      USER_SERVICE_URL: ${AI_USER_SERVICE_URL:-http://user:8085}
      KEYCLOAK_TOKEN_URL: ${AI_KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/finora/protocol/openid-connect/token}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-finora-user-client}
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    depends_on:
      cic:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - finora-network

  # ============ PAYMENT OWNED DATABASE AND CACHE ============
  payment-postgres:
    profiles: ["payment"]
    image: postgres:17.5-alpine
    container_name: finora-payment-postgres
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-finora_payment}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PAYMENT_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${PAYMENT_DB_USERNAME:-finora_payment}
      APP_DB_PASSWORD: "${PAYMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_POSTGRES_HOST_PORT:-15434}:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  payment-redis:
    profiles: ["payment"]
    image: redis:7-alpine
    container_name: finora-payment-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${PAYMENT_REDIS_PASSWORD}"]
    environment:
      PAYMENT_REDIS_PASSWORD: "${PAYMENT_REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:${PAYMENT_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - payment-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${PAYMENT_REDIS_PASSWORD}\" redis-cli ping | grep PONG >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ BLOCKCHAIN OWNED DATABASE (OFFLINE FALLBACK) ============
  blockchain-postgres:
    profiles: ["blockchain"]
    image: postgres:17.5-alpine
    container_name: finora-blockchain-postgres
    environment:
      POSTGRES_DB: ${BLOCKCHAIN_DB_NAME:-finora_blockchain}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${BLOCKCHAIN_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${BLOCKCHAIN_DB_USERNAME:-finora_blockchain}
      APP_DB_PASSWORD: "${BLOCKCHAIN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${BLOCKCHAIN_POSTGRES_HOST_PORT:-15435}:5432"
    volumes:
      - blockchain-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - finora-network

  # ============ USER OWNED CACHE (PostgreSQL nam tren host) ============
  user-redis:
    profiles: ["user", "demo"]
    image: redis:7-alpine
    restart: unless-stopped
    container_name: finora-user-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${USER_REDIS_PASSWORD:-}"]
    environment:
      USER_REDIS_PASSWORD: "${USER_REDIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:${USER_REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - user-redis-data:/data
    healthcheck:
      # Chay duoc ca khi USER_REDIS_PASSWORD rong (dev) lan khi da dat password.
      test:
        - CMD-SHELL
        - if [ -n "$$USER_REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$USER_REDIS_PASSWORD" redis-cli ping; else redis-cli ping; fi | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finora-network

  # ============ CIC MOCK SERVICE ============
  # Source nam o repo ngang cap voi finora-platform. CIC dung database Neon
  # rieng va Flyway cua chinh service; AI chi goi REST, khong doc DB CIC.
  cic:
    profiles: ["demo"]
    build:
      context: ../../cic-service
      dockerfile: Dockerfile
    image: finora/cic:demo
    restart: unless-stopped
    container_name: finora-cic
    environment:
      SPRING_DATASOURCE_URL: "${CIC_DB_URL}"
      SPRING_DATASOURCE_USERNAME: "${CIC_DB_USERNAME}"
      SPRING_DATASOURCE_PASSWORD: "${CIC_DB_PASSWORD}"
      CIC_PORT: "9000"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${CIC_HOST_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - finora-network

  # ============ USER APPLICATION (DEMO INTEGRATION) ============
  # Database nam ngoai Compose (Neon hoac PostgreSQL host). Profile `user` van
  # chi bat Redis de khong thay doi workflow IntelliJ cu; profile `demo` moi
  # dong goi va chay ca finora-user.
  user:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.java-service
      args:
        SERVICE_MODULE: finora-user
    image: finora/user:local
    restart: unless-stopped
    container_name: finora-user
    environment:
      USER_DB_URL: "${USER_DB_URL}"
      USER_DB_USERNAME: "${USER_DB_USERNAME}"
      USER_DB_PASSWORD: "${USER_DB_PASSWORD}"
      USER_REDIS_HOST: user-redis
      USER_REDIS_PORT: "6379"
      USER_REDIS_PASSWORD: "${USER_REDIS_PASSWORD:-}"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-finora}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-finora-user-client}
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      # So khớp issuer công khai trong JWT; JWKS vẫn đi qua DNS nội bộ Docker.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/${KEYCLOAK_REALM:-finora}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-finora}/protocol/openid-connect/certs
      AI_SERVICE_URL: http://ai:8000
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://host.docker.internal:8086}
      FINORA_AES_SECRET: "${FINORA_AES_SECRET}"
      FINORA_HMAC_SECRET: "${FINORA_HMAC_SECRET}"
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-localhost}
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${USER_HOST_PORT:-8085}:8085"
    depends_on:
      keycloak:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    healthcheck:
      # eclipse-temurin jammy co bash; /dev/tcp la tinh nang cua bash, khong phai dash.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - finora-network

  # ============ INVESTMENT OWNED DATABASE ============
  investment-postgres:
    profiles: ["investment"]
    image: postgres:17.5-alpine
    container_name: finora-investment-postgres
    environment:
      POSTGRES_DB: ${INVESTMENT_DB_NAME:-finora_investment}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${INVESTMENT_POSTGRES_ADMIN_PASSWORD}"
      APP_DB_USERNAME: ${INVESTMENT_DB_USERNAME:-finora_investment}
      APP_DB_PASSWORD: "${INVESTMENT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${INVESTMENT_POSTGRES_HOST_PORT:-15437}:5432"
    volumes:
      - investment-postgres-data:/var/lib/postgresql/data
      - ./postgresql/init-service-user.sh:/docker-entrypoint-initdb.d/01-create-service-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${APP_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${APP_DB_USERNAME}" -d "$${POSTGRES_DB}" -c 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - finora-network

  # ============ APPLICATION SAMPLE ============
  loan:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.java-service
      args:
        SERVICE_MODULE: finora-loan
    image: finora/loan:local
    container_name: finora-loan
    environment:
      LOAN_DB_URL: jdbc:postgresql://loan-postgres:5432/${LOAN_DB_NAME:-finora_loan}
      LOAN_DB_USERNAME: ${LOAN_DB_USERNAME:-finora_loan}
      LOAN_DB_PASSWORD: "${LOAN_DB_PASSWORD}"
      FINERACT_BASE_URL: http://fineract:8443/fineract-provider/api/v1
      FINERACT_API_USERNAME: ${FINERACT_API_USERNAME:-mifos}
      FINERACT_API_PASSWORD: "${FINERACT_API_PASSWORD:-password}"
      FINERACT_PREVIEW_CLIENT_EXTERNAL_ID: ${FINERACT_PREVIEW_CLIENT_EXTERNAL_ID:-FINORA-PREVIEW-CLIENT}
      AI_SERVICE_URL: http://ai:8000
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "127.0.0.1:${LOAN_HOST_PORT:-8081}:8081"
    depends_on:
      loan-postgres:
        condition: service_healthy
    networks:
      - finora-network

volumes:
  keycloak-import:
  loan-postgres-data:
  fineract-postgres-data:
  payment-postgres-data:
  blockchain-postgres-data:
  payment-redis-data:
  user-redis-data:
  investment-postgres-data:

networks:
  finora-network:
    driver: bridge
