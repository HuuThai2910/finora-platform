- id: PL-HAN-MUC-01
  title: Hạn mức dư nợ 100 triệu và 400 triệu
  roles: [ALL]
  kind: CHUA_XAC_MINH
  body: >-
    Tạp chí Ngân hàng và một số bài viết trong ngành dẫn lại rằng Quyết định 2866/QĐ-NHNN ngày
    22-07-2025 đặt hai mức dư nợ cho cho vay ngang hàng thử nghiệm: 100 triệu đồng cho một khách hàng
    trên một nền tảng và 400 triệu đồng trên toàn bộ các nền tảng. FINORA chưa có bản toàn văn của quyết
    định này để đối chiếu, nên hai con số chưa được coi là quy định đã xác minh. Hiện FINORA dùng chúng
    như giới hạn sản phẩm: hạn mức gợi ý cao nhất là 100 triệu đồng, và hồ sơ có tổng dư nợ CIC cộng
    khoản xin vay trên 400 triệu đồng bị chặn. Khi có bản gốc, FINORA sẽ cập nhật lại.
  legal_refs: []
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-LIMIT-01, LEGAL-OPEN-02 (NEEDS_PRIMARY_SOURCE); finora-ai config/product_config.json (legal_limits)"
