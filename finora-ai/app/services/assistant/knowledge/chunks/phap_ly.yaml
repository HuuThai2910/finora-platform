- id: PL-KHONG-NHAM-LAN-01
  title: Không gây nhầm lẫn giữa luật, chính sách và thông tin chưa xác minh
  roles: [ALL]
  kind: LUAT
  body: >-
    Doanh nghiệp không được cung cấp thông tin không đầy đủ, sai lệch hoặc gây nhầm lẫn cho người tiêu
    dùng. Vì vậy trợ lý tách ba loại nội dung. Quy định pháp luật: có văn bản chính thức, kèm số điều và
    đường dẫn. Chính sách FINORA: do FINORA tự chọn và có thể đổi, ví dụ biểu phí tất toán tham chiếu
    Vietcombank, hạng A–E, ngưỡng duyệt 75/65, kỳ hạn tối thiểu 3 tháng, phí chợ Notes 5%. Chưa xác minh
    nguồn: mới thấy qua nguồn thứ cấp, ví dụ hạn mức dư nợ cho vay ngang hàng. Mọi câu trả lời pháp lý
    là thông tin tham khảo, không phải ý kiến pháp lý.
  legal_refs: ["LAW-CONSUMER-2023:Điều 10"]
  source: "docs/LEGAL-COMPLIANCE.md mục 1 (LAW-CONSUMER-2023); spec mục 2, 9"
