- id: PL-LAI-QUA-HAN-01
  title: Mức trần lãi quá hạn, lãi chậm trả và thứ tự thu nợ
  roles: [BORROWER, ADMIN]
  kind: LUAT
  body: >-
    Văn bản về hoạt động cho vay đặt hai mức trần: lãi trên dư nợ gốc quá hạn không vượt 150% lãi suất
    trong hạn, và lãi chậm trả trên tiền lãi chưa trả không vượt 10%/năm; hai loại không cộng trùng trên
    cùng một khoản tiền. Ví dụ lãi trong hạn 12%/năm thì lãi trên gốc quá hạn tối đa 18%/năm. Thứ tự thu
    khi bạn trả: gốc quá hạn, lãi trên gốc quá hạn, gốc đến hạn, lãi trên gốc đến hạn, sau cùng là lãi
    chậm trả và phí khác theo hợp đồng. FINORA dùng các mốc này làm chuẩn tham chiếu; việc áp dụng trực
    tiếp cho nền tảng P2P còn chờ rà soát pháp lý. Số tiền chính thức do hệ thống lõi tính.
  legal_refs: ["CIRCULAR-LENDING-CONSOLIDATED-2026:Điều 13", "CIRCULAR-LENDING-CONSOLIDATED-2026:Điều 18"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-SERVICING-01; docs/LOAN-SERVICING-POLICY.md §3.4"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
