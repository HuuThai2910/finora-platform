- id: PL-DU-LIEU-CA-NHAN-01
  title: FINORA xử lý dữ liệu cá nhân của bạn thế nào
  roles: [ALL]
  kind: CHINH_SACH
  body: >-
    FINORA chỉ thu thập dữ liệu cần cho xác minh danh tính, thẩm định, hợp đồng và trả nợ, theo nguyên
    tắc tối thiểu hóa của pháp luật về bảo vệ dữ liệu cá nhân. Dịch vụ quản lý khoản vay không lưu ảnh
    hay số CCCD thô; nhật ký hệ thống không ghi thông tin định danh; sự kiện gửi giữa các dịch vụ chỉ
    mang mã nghiệp vụ, không mang CCCD hay thu nhập. Nhà đầu tư chỉ thấy hồ sơ người vay đã ẩn danh.
    Thời hạn lưu, mã hóa khi lưu và quy trình đáp ứng quyền của chủ thể dữ liệu vẫn đang được hoàn
    thiện trước khi vận hành thật.
