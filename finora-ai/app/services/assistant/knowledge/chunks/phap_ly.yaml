- id: PL-THANH-TOAN-01
  title: Tiền giải ngân và trả nợ đi qua kênh thanh toán được phép
  roles: [ALL]
  kind: LUAT
  body: >-
    Giải ngân và thanh toán gốc, lãi, phí của khoản vay phải đi qua tài khoản thanh toán mở tại ngân
    hàng hoặc ví điện tử của tổ chức trung gian thanh toán được cấp phép. Vì vậy FINORA không tự giữ
    tiền như một tài khoản pháp lý riêng: hệ thống thanh toán của FINORA chỉ ghi sổ, điều phối và đối
    soát với đối tác thanh toán. Bản thử nghiệm dùng môi trường sandbox của ZaloPay hoặc chế độ giả
    lập, chưa phải tiền thật; trước khi chạy thật cần hợp đồng với tổ chức cung ứng dịch vụ thanh toán
    và quy trình đối soát được duyệt.
  legal_refs: ["LAW-P2P-2025:Điều 11 khoản 1 điểm b"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-PAYMENT-01"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
  keywords: ["ví có an toàn không", "tiền gửi ở đâu", "tài khoản thanh toán", "ví điện tử", "trung gian thanh toán", "giải ngân qua đâu"]

- id: PL-CIC-DU-NO-01
  title: Vì sao FINORA tra cứu thông tin tín dụng CIC
  roles: [ALL]
  kind: LUAT
  body: >-
    Nền tảng cho vay ngang hàng phải có biện pháp xác định và quản lý dư nợ tối đa của người vay, báo
    cáo và khai thác dữ liệu của Trung tâm Thông tin tín dụng (CIC). Vì vậy khi chấm điểm, FINORA tra cứu
    điểm tín dụng, nhóm nợ và tổng dư nợ của người vay. Bản thử nghiệm dùng dịch vụ CIC mô phỏng, không
    phải dữ liệu CIC thật. Không tra cứu được CIC thì hồ sơ không bị từ chối vì lý do đó mà chuyển
    chuyên viên thẩm định. Trước khi chạy thật, FINORA còn phải kiểm tra dư nợ thực tế của người vay chứ
    không chỉ số tiền của hồ sơ mới.
  legal_refs: ["LAW-P2P-2025:Điều 11"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-LIMIT-01; finora-ai rule_engine.py (thiếu dữ liệu -> PENDING_REVIEW)"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
  keywords: ["CIC", "tra cứu CIC", "thông tin tín dụng", "vì sao tra CIC", "dư nợ tối đa", "điểm CIC", "lịch sử tín dụng"]

- id: PL-CUNG-CAP-THONG-TIN-01
  title: Nhà đầu tư được xem hồ sơ người vay trước khi đặt lệnh
  roles: [BORROWER, INVESTOR, ADMIN]
  kind: LUAT
  body: >-
    Công ty cho vay ngang hàng phải cung cấp thông tin đầy đủ, minh bạch, chính xác cho khách hàng, và
    phải cung cấp đầy đủ thông tin khoản vay trước khi khách hàng giao kết thỏa thuận cho vay. Vì vậy
    nhà đầu tư xem được hồ sơ người vay của khoản đang gọi vốn: khả năng trả nợ tự khai, tuổi, eKYC,
    nhà ở, học vấn, lịch sử vay tại FINORA, điểm CIC, điểm, hạng, xác suất vỡ nợ, bảng luật đã chấm và
    khoản vay đề nghị. Số liệu trợ lý nêu đều lấy trực tiếp từ hệ thống. Bước ghi nhận nhà đầu tư xác
    nhận đã được cung cấp đủ thông tin vẫn đang được bổ sung.
  legal_refs: ["LAW-P2P-2025:Điều 22 khoản 3", "LAW-P2P-2025:Điều 22 khoản 8 điểm c"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-DISCLOSURE-02"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
  keywords: ["xem hồ sơ người vay", "sao được xem hồ sơ", "thông tin khoản vay", "minh bạch", "trước khi đầu tư", "cung cấp thông tin"]

- id: PL-CHIA-SE-DU-LIEU-01
  title: Dữ liệu người vay chỉ chia sẻ với các bên tham gia
  roles: [BORROWER, INVESTOR, ADMIN]
  kind: LUAT
  body: >-
    Dữ liệu khách hàng được chia sẻ minh bạch giữa các bên tham gia khoản vay nhưng phải bảo mật với bên
    không liên quan. Vì vậy hồ sơ người vay chỉ mở cho tài khoản nhà đầu tư và chỉ với khoản vay đã lên
    Sàn; hồ sơ khác trả về "không tìm thấy" như không tồn tại. Nhà đầu tư không nhận họ tên, số CCCD, số
    điện thoại, email, địa chỉ hay ghi chú xử lý nội bộ của người vay. Trợ lý cũng chỉ đọc dữ liệu tài
    khoản của bạn có quyền xem; hỏi hồ sơ của người khác sẽ nhận câu trả lời "không tìm thấy".
  legal_refs: ["LAW-P2P-2025:Điều 11 khoản 2 điểm d"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-DISCLOSURE-02; spec mục 10 (phân quyền)"
