- id: PL-SANDBOX-01
  title: FINORA trong cơ chế thử nghiệm cho vay ngang hàng
  roles: [ALL]
  kind: LUAT
  body: >-
    Cho vay ngang hàng (P2P) là việc người cho vay và người vay được kết nối qua nền tảng công nghệ để
    giao kết khoản vay với nhau. Ở Việt Nam, hoạt động này đang được thí điểm trong cơ chế thử nghiệm có
    kiểm soát trong lĩnh vực ngân hàng; văn bản quy định phạm vi thử nghiệm và giải thích các khái niệm
    liên quan. FINORA được thiết kế theo mô hình này và không tự nhận là tổ chức tín dụng. Pháp nhân vận
    hành FINORA là công ty P2P tham gia thử nghiệm, tổ chức tín dụng hay đối tác của tổ chức tín dụng
    vẫn chờ người có thẩm quyền xác nhận.
  legal_refs: ["LAW-P2P-2025:Điều 1", "LAW-P2P-2025:Điều 3"]
  source: "docs/LEGAL-COMPLIANCE.md mục 1 (LAW-P2P-2025), mục 5 (LEGAL-OPEN-01)"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
  keywords: ["cho vay ngang hàng", "P2P", "sandbox", "thử nghiệm", "có hợp pháp không", "tổ chức tín dụng", "pháp lý"]

- id: PL-THOI-HAN-01
  title: Kỳ hạn hợp đồng vay tối đa 24 tháng
  roles: [ALL]
  kind: LUAT
  body: >-
    Hợp đồng giữa người vay và người cho vay trong giải pháp cho vay ngang hàng thử nghiệm không được
    dài quá 02 năm. Vì vậy mọi sản phẩm vay của FINORA có kỳ hạn tối đa 24 tháng, được chặn cả khi tạo
    sản phẩm lẫn khi chấm điểm hồ sơ; hồ sơ vượt mốc này bị từ chối. Ngược lại, kỳ hạn tối thiểu 3
    tháng của các sản phẩm hiện tại là chính sách của FINORA, không phải yêu cầu của văn bản.
  legal_refs: ["LAW-P2P-2025:Điều 11 khoản 1 điểm c"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-TERM-01; finora-loan LoanProduct (INVALID_LOAN_PRODUCT_TERM_RANGE); finora-ai rule_engine.py (TERM_EXCEEDS_LEGAL_LIMIT)"
  version: LEGAL_COMPLIANCE_2026_10_10
