- id: PL-PHI-TRA-TRUOC-01
  title: Phí trả nợ trước hạn do các bên thỏa thuận
  roles: [BORROWER, ADMIN]
  kind: LUAT
  body: >-
    Văn bản về hoạt động cho vay cho phép các bên thỏa thuận phí trả nợ trước hạn và yêu cầu ghi rõ loại
    phí, mức phí trong hợp đồng; văn bản không ấn định một tỷ lệ chung. Vì vậy mức 0,5% hoặc 1% của
    FINORA không phải do luật quy định: đó là chính sách của FINORA tham chiếu biểu phí trả nợ trước hạn
    của Vietcombank, được chụp lại vào báo giá bạn đồng ý trước khi trả. FINORA dùng văn bản này làm
    chuẩn tham chiếu; việc áp dụng trực tiếp cho nền tảng P2P còn chờ rà soát pháp lý.
  legal_refs: ["CIRCULAR-LENDING-CONSOLIDATED-2026:Điều 14", "CIRCULAR-LENDING-CONSOLIDATED-2026:Điều 23"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-SERVICING-01"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
