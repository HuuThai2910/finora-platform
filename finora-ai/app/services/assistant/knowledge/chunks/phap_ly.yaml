- id: PL-TRO-LY-AI-01
  title: Nghĩa vụ thông báo người dùng đang trò chuyện với AI
  roles: [ALL]
  kind: CHUA_XAC_MINH
  body: >-
    Quy định mới về trí tuệ nhân tạo được cho là yêu cầu thông báo khi người dùng đang tương tác với hệ
    thống AI, nhưng FINORA chưa đối chiếu văn bản gốc nên nội dung nghĩa vụ và thời điểm hiệu lực chưa
    được xác minh. Dù vậy, FINORA chủ động thông báo ngay lần đầu bạn mở trợ lý: bạn đang trò chuyện
    với AI, dữ liệu đã lược bỏ định danh được gửi tới nhà cung cấp AI ở nước ngoài, và không được nhập
    CCCD, mật khẩu, PIN hay OTP. Câu trả lời của trợ lý có thể sai; số liệu trên thẻ lấy trực tiếp từ
    hệ thống mới là căn cứ chính.
