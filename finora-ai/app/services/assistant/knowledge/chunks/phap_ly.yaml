- id: PL-TRAN-LAI-01
  title: Trần lãi suất 20%/năm
  roles: [ALL]
  kind: LUAT
  body: >-
    Lãi suất vay do các bên thỏa thuận trong quan hệ dân sự không được vượt 20%/năm, trừ khi luật khác
    có quy định riêng. FINORA vận hành như nền tảng P2P, không phải tổ chức tín dụng, nên áp trần bảo
    thủ này cho mọi sản phẩm: lãi tối thiểu lớn hơn 0 và không vượt lãi cơ sở, lãi cơ sở không vượt lãi
    tối đa, lãi tối đa không quá 20%/năm. Lãi cuối sau điều chỉnh theo hạng luôn nằm trong khoảng của
    sản phẩm và dưới trần. Nếu sau này pháp nhân vận hành là tổ chức tín dụng, mức trần phải rà soát lại.
    Mức lãi tối thiểu của từng sản phẩm là chính sách kinh doanh, không do pháp luật ấn định.
  legal_refs: ["LAW-CIVIL-2015:Điều 468"]
  source: "docs/LEGAL-COMPLIANCE.md LEGAL-RATE-01; finora-loan LoanProduct (INVALID_LOAN_PRODUCT_RATE_RANGE), application.yml (legal-maximum-annual-rate)"
  version: LEGAL_COMPLIANCE_2026_10_10
  checked_at: "2026-10-15"
