  kind: CHINH_SACH
  body: >-
    Khi khoản vay quá hạn từ 91 ngày, khoản vay và các Note của nó chuyển trạng thái nợ xấu; dòng tiền
    dự kiến dừng lại nhưng bạn vẫn nhận phần người vay trả về sau theo tỷ lệ sở hữu. FINORA không cam
    kết bù lỗ hay bảo đảm hoàn vốn. Nhà đầu tư thấy số ngày quá hạn, nhóm nợ và số tiền quá hạn trên
