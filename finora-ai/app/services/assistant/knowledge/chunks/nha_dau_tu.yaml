  roles: [INVESTOR, ADMIN]
  kind: CHINH_SACH
  body: >-
    Khi lệnh khớp, FINORA thu phí 5% trên tiền bán, trừ vào số tiền người bán nhận; người mua trả đúng
    giá khớp, không chịu thêm phí. Phí làm tròn xuống tới đồng để người bán không bị trừ thừa. Ví dụ bán
