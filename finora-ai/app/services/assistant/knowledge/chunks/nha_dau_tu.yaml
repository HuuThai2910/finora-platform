# Đoạn kiến thức cho nhà đầu tư: từ listing tới Note, quy tắc góp vốn, chợ Notes, Auto-Invest, rủi ro.
# Không có câu nào xếp hạng hay khuyên chọn khoản vay (spec mục 10). Phí 5%, mệnh giá, 14 ngày là chính
# sách/tham số của FINORA, không phải quy định pháp luật.

- id: NDT-LUONG-01
  title: Từ khoản vay trên Sàn đến Note
  roles: [INVESTOR, ADMIN]
  kind: HUONG_DAN
  body: >-
    Hành trình góp vốn có năm chặng. Một: khoản vay đang gọi vốn hiện trên Sàn. Hai: bạn đặt lệnh góp
    vốn và hệ thống giữ tiền trong ví. Ba: giữ tiền thành công thì lệnh thành phần vốn cam kết
    (commitment), được tính vào tiến độ gọi vốn. Bốn: khoản vay đủ vốn, danh sách nhà đầu tư bị khóa,
    hợp đồng được lập và nhà đầu tư ký trước người vay. Năm: đủ chữ ký và giải ngân xong thì FINORA phát
    hành Note cho bạn; từ đó Note mới sinh lãi và nhận gốc lãi mỗi kỳ người vay trả. Hết hạn gọi vốn mà
    chưa đủ vốn thì phần vốn cam kết bị hủy và tiền giữ trả lại ví.
  legal_refs: []
  source: "finora-common CommitmentStatus, NoteStatus; finora-mobile investment/constant.ts (PENDING_NOTE, CONTRACT_NOTE)"
  version: FINORA_APP_2026_10
  checked_at: "2026-10-15"
  keywords: ["góp vốn", "quy trình đầu tư", "các bước đầu tư", "lệnh góp vốn", "phát hành Note", "khi nào có Note", "commitment"]

- id: NDT-COMMITMENT-NOTE-01
  title: Commitment, Note và danh mục của bạn
  roles: [INVESTOR]
  kind: HUONG_DAN
  body: >-
    Commitment là phần vốn bạn đã cam kết cho một khoản vay đang gọi vốn: tiền đang bị giữ trong ví,
    chưa chuyển cho người vay và chưa sinh lãi. Note là chứng nhận phần quyền lợi của bạn trong khoản
    vay sau khi giải ngân; mỗi Note có mệnh giá, dư nợ gốc còn lại và nhận gốc lãi theo tỷ lệ mỗi khi
    người vay trả kỳ. Note có ba trạng thái: đang hoạt động, đã đóng (thu hết gốc hoặc khoản vay tất
    toán) và nợ xấu. Màn Danh mục tách tiền đang chờ giải ngân, dư nợ gốc của Note đang hoạt động, lãi
    đã nhận và Note nợ xấu được đánh dấu riêng.
  legal_refs: []
  source: "finora-common CommitmentStatus, NoteStatus; docs/superpowers/specs/2026-10-15-tro-ly-finora-design.md mục 14.2"
  version: FINORA_APP_2026_10
  checked_at: "2026-10-15"
  keywords: ["commitment", "Note là gì", "khác Note", "khác nhau thế nào", "danh mục", "chờ giải ngân", "phần vốn cam kết", "lãi đã nhận"]

- id: NDT-MENH-GIA-01
  title: Mệnh giá Note, mức góp tối thiểu và bội số
  roles: [INVESTOR, ADMIN]
  kind: CHINH_SACH
  body: >-
    Cài đặt mặc định của sàn: mệnh giá mỗi Note 1.000.000 đ, số tiền góp tối thiểu 1.000.000 đ (một
    Note). Số tiền góp phải chia hết cho mệnh giá và không vượt phần khoản vay còn thiếu; số Note nhận
    được bằng số tiền chia mệnh giá. Ngoại lệ: khi phần còn thiếu nhỏ hơn mức tối thiểu, bạn được góp
    đúng bằng phần còn thiếu để khoản vay không kẹt một phần lẻ. Quản trị viên đổi được mệnh giá và mức
    tối thiểu (từ 1.000 đ) và số ngày gọi vốn (1 đến 90); mỗi khoản vay giữ tham số lúc lên Sàn nên thay
    đổi chỉ áp cho khoản lên sau.
