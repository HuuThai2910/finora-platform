- id: NDT-KY-HD-01
  title: Nhà đầu tư ký hợp đồng
  roles: [INVESTOR]
  kind: HUONG_DAN
  body: >-
    Khi khoản vay đủ vốn, mọi nhà đầu tư và người vay ký trên cùng một bản PDF hợp đồng. Nhà đầu tư ký
    trước; đủ chữ ký của tất cả nhà đầu tư thì người vay mới được ký. Hạn ký mặc định là 7 ngày kể từ
    lúc lập hợp đồng. Ký cần mã PIN, nên hãy đọc PDF trước. Khoản vay chỉ giải ngân khi đủ chữ ký của
    tất cả các bên; một bên chậm ký thì cả khoản vay phải chờ. Lệnh do Auto-Invest đặt cũng cần bạn tự
    ký. Bản thử nghiệm ghi nhận bằng thao tác bấm đồng ý hoặc VNPT SmartCA môi trường thử, chưa phải
    chữ ký số chính thức.
