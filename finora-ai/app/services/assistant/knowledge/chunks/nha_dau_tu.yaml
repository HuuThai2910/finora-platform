- id: NDT-KHOP-LENH-01
  title: Lệnh trên chợ Notes khớp như thế nào
  roles: [INVESTOR, ADMIN]
  kind: CHINH_SACH
  body: >-
    Lệnh khớp ngay khi giá mua cao nhất bằng hoặc cao hơn giá bán thấp nhất. Thứ tự ưu tiên: giá tốt
    hơn đi trước, cùng giá thì lệnh đặt trước đi trước. Giá khớp là giá của lệnh đang nằm chờ trong sổ,
    nên người đặt sau có thể được giá tốt hơn giá mình đặt. Lệnh khớp được bao nhiêu thì khớp bấy
    nhiêu; phần còn lại nằm chờ đến khi khớp, bị hủy hoặc khoản vay đóng sổ. Lệnh mua chưa khớp thường
    vì giá mua thấp hơn giá bán thấp nhất đang có, hoặc cùng giá nhưng có lệnh khác đặt trước bạn; xem
    sổ lệnh để so giá.
