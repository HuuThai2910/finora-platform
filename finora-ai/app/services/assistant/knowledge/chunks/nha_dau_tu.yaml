- id: NDT-AUTO-BO-QUA-01
  title: Vì sao Auto-Invest bỏ qua một khoản vay
  roles: [INVESTOR]
  kind: HUONG_DAN
  body: >-
    Nhật ký Auto-Invest ghi lý do mỗi lần bỏ qua. Đã đầu tư: bạn đã có lệnh đang chạy với khoản vay đó.
    Dưới mức tối thiểu: số tiền mỗi khoản bạn đặt nhỏ hơn mức góp tối thiểu. Không đủ tiền: số dư khả
    dụng không đủ để giữ tiền, hãy nạp thêm. Khoản vay đã đủ vốn: người bật trước đã góp hết phần còn
    thiếu. Khoản vay đã đóng: hết hạn hoặc không còn nhận vốn. Khoản vay không khớp tiêu chí (hạng,
    lãi, kỳ hạn) thì không có dòng nhật ký nào, và khoản lên Sàn trước lúc bạn bật cũng không được xét.
