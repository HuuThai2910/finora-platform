- id: NDT-CUA-SO-01
  title: Thời hạn gọi vốn 14 ngày và hoàn tiền khi hết hạn
  roles: [INVESTOR, ADMIN]
  kind: CHINH_SACH
  body: >-
    Theo cài đặt mặc định, mỗi khoản vay mở gọi vốn trong 14 ngày; hạn đóng hiện trên thẻ khoản vay. Qua
    hạn thì không nhận lệnh mới; app tự coi đợt đã quá hạn là hết hạn, dù máy chủ đóng các đợt hết hạn
    theo lô khoảng 30 giây một lần. Hết hạn mà chưa đủ vốn thì mọi phần vốn cam kết bị hủy, lệnh chuyển
    "đã hủy" với lý do hết hạn gọi vốn và tiền giữ được trả lại số dư khả dụng.
    Việc trả tiền chạy nền và tự thử lại tới khi hệ thống thanh toán xác nhận, thường xong trong vài
    phút. Bạn không mất phí khi khoản vay không gọi đủ vốn.
