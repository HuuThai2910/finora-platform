- id: NDT-GIU-TIEN-01
  title: Vì sao tiền của tôi đang bị giữ
  roles: [INVESTOR]
  kind: CHINH_SACH
  body: >-
    Tiền của nhà đầu tư bị giữ trong hai trường hợp. Một là phần vốn cam kết cho khoản vay đang gọi
    vốn: giữ tới khi giải ngân (tiền chuyển cho người vay) hoặc khi lệnh bị hủy, hết hạn (tiền trả lại).
    Hai là lệnh mua trên chợ Notes: khi đặt, hệ thống giữ ngay số tiền bằng dư nợ gốc lớn nhất của các
    Note trong khoản vay nhân giá đặt nhân số lượng, vì lúc đó chưa biết sẽ khớp vào Note nào. Khớp ở
    giá thấp hơn hoặc vào Note dư nợ nhỏ hơn thì phần giữ thừa trả lại ví khi lệnh kết thúc. Note trong
    lệnh bán vẫn của bạn và vẫn nhận gốc lãi tới khi khớp.
  legal_refs: []
  source: "finora-investment OrderBookPricing.holdAmount; finora-mobile secondary-market/constant.ts (BUY_NOTE, SELL_NOTE)"
  version: ORDER_BOOK_POLICY_INV_E1
  checked_at: "2026-10-15"
  keywords: ["tiền bị giữ", "tiền đang giữ", "giữ tiền", "lệnh mua giữ tiền", "phần giữ thừa", "trả lại ví", "tiền ở đâu"]

- id: NDT-NO-XAU-01
