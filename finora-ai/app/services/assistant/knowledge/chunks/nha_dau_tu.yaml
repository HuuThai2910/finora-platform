- id: NDT-AUTO-01
  title: Auto-Invest hoạt động thế nào
  roles: [INVESTOR, ADMIN]
  kind: CHINH_SACH
  body: >-
    Auto-Invest tự đặt lệnh góp vốn khi có khoản vay mới khớp tiêu chí bạn chọn: các hạng chấp nhận,
    lãi suất tối thiểu, kỳ hạn tối đa và số tiền mỗi khoản. Chỉ xét khoản vay mở gọi vốn sau lúc bạn
