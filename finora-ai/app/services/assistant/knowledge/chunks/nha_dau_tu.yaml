    FINORA chặn tự khớp: lệnh mới của bạn gặp lệnh của chính bạn ở phía bên kia sổ thì dừng, phần còn
    lại của lệnh mới bị hủy, lệnh cũ giữ nguyên. Hệ thống không bỏ qua lệnh của bạn để khớp tiếp vì như
