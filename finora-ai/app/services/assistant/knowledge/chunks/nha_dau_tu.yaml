- id: NDT-LENH-GOP-VON-01
  title: Lệnh góp vốn bị từ chối hoặc muốn hủy
  roles: [INVESTOR]
  kind: HUONG_DAN
  body: >-
    Lệnh góp vốn bị từ chối khi số tiền dưới mức tối thiểu, không chia hết mệnh giá Note, vượt phần còn
    thiếu, khoản vay không còn nhận vốn hoặc đã hết hạn, ví không đủ tiền để giữ, bạn chưa xong eKYC,
    hoặc đó là khoản vay của chính bạn. Lệnh "đang giữ tiền" là đang chờ hệ thống thanh toán xác nhận;
    nếu kẹt, hệ thống tự làm tiếp sau khoảng 2 phút. Bạn hủy được phần vốn cam kết khi khoản vay còn
    đang gọi vốn; khi đã đủ vốn (danh sách nhà đầu tư khóa để lập hợp đồng) hoặc đang giải ngân thì
    không hủy được. Hủy xong, tiền giữ trả lại ví.
