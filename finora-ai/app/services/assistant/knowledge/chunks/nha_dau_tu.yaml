- id: NDT-SO-LENH-01
  title: Chợ Notes và giá tính theo phần trăm
  roles: [INVESTOR, ADMIN]
  kind: CHINH_SACH
  body: >-
    Chợ Notes là nơi bán lại Note đang giữ để lấy tiền trước hạn, hoặc mua Note của nhà đầu tư khác.
    Giá đặt tính theo phần trăm dư nợ gốc còn lại của mỗi Note, từ 0,1% đến 100%, bước 0,1%; mỗi lệnh
    tối đa 10.000 Note. Tiền của một Note bằng dư nợ gốc còn lại nhân giá, làm tròn tới đồng. Ví dụ Note
    còn 800.000 đ dư nợ, khớp ở giá 96% thì giá trị 768.000 đ. Giá dưới 100% nghĩa là người bán chấp
    nhận nhận ít hơn dư nợ để có tiền ngay; người mua bỏ ra ít hơn và nhận đủ gốc lãi về sau nếu người
    vay trả đúng hạn.
