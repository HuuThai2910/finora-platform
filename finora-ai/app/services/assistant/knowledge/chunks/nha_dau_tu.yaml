- id: NDT-LAI-DU-KIEN-01
  title: Lãi dự kiến không phải lãi được bảo đảm
  roles: [INVESTOR]
  kind: CHINH_SACH
  body: >-
    Lãi dự kiến trên app là ước tính cả kỳ hạn với giả định người vay trả đúng lịch, tính trên số tiền
    bạn góp. Trả gốc đều thì lãi xấp xỉ số tiền góp nhân lãi tháng nhân (số kỳ + 1) chia 2; trả góp đều
    thì lãi bằng tổng các kỳ trừ số tiền góp. Lịch chính thức lập lúc giải ngân (kỳ đầu lẻ ngày, làm
    tròn) nên số thật có thể lệch đôi chút. Lãi thực nhận còn thay đổi nếu người vay trả trước, tất toán
    sớm, quá hạn hoặc nợ xấu, và bạn có thể mất một phần vốn. FINORA không bảo đảm lợi nhuận.
  legal_refs: []
  source: "finora-mobile src/features/market/investRules.ts (expectedInterest)"
  version: FINORA_APP_2026_10
  checked_at: "2026-10-15"
  keywords: ["lãi dự kiến", "lợi nhuận", "bảo đảm lãi", "cam kết lãi", "được bao nhiêu lãi", "lãi thực nhận", "rủi ro"]

- id: NDT-KHONG-TU-VAN-01
  title: Trợ lý không tư vấn đầu tư
  roles: [INVESTOR]
  kind: CHINH_SACH
  body: >-
    Trợ lý không khuyên bạn nên đầu tư khoản nào và không xếp hạng khoản vay tốt nhất, an toàn nhất hay
    lời nhất. Trợ lý chỉ lọc trung lập theo tiêu chí bạn tự đặt (hạng, lãi suất tối thiểu, kỳ hạn tối
    đa), sắp theo hạn đóng gọi vốn, rồi giải thích dữ liệu của từng khoản. Mọi khoản vay đều có rủi ro
    người vay chậm trả hoặc không trả, kể cả khoản hạng A. Quyết định đầu tư và rủi ro thuộc về bạn;
    hãy đọc hồ sơ người vay và hợp đồng trước khi đặt lệnh. Đây là thông tin tham khảo, không phải tư
    vấn đầu tư.
  legal_refs: []
  source: "docs/superpowers/specs/2026-10-15-tro-ly-finora-design.md mục 8.2, 10; docs/LEGAL-COMPLIANCE.md (LAW-CONSUMER-2023)"
  version: AI_CHAT_001
  checked_at: "2026-10-15"
  keywords: ["nên đầu tư khoản nào", "khoản nào tốt nhất", "an toàn nhất", "lời nhất", "khuyên", "tư vấn đầu tư", "gợi ý đầu tư"]

- id: NDT-HANG-01
  title: Hạng A–E và hồ sơ người vay trên Sàn
  roles: [INVESTOR]
  kind: CHINH_SACH
  body: >-
    Hạng A–E trên thẻ khoản vay do FINORA xếp từ điểm tín dụng tổng hợp 0 đến 100: A từ 84 điểm, B từ
    69, C từ 50, D từ 37, E dưới 37. Hạng dùng để định giá lãi; hạng không phải xếp hạng của cơ quan
    nhà nước và không bảo đảm người vay trả đúng hạn. Trước khi đặt lệnh bạn xem được hồ sơ người vay
    ẩn danh: khả năng trả nợ tự khai, tuổi, eKYC, nhà ở, học vấn, lịch sử vay tại FINORA, điểm CIC,
    điểm, hạng, xác suất vỡ nợ và bảng luật chấm điểm. Hồ sơ không có họ tên, CCCD hay thông tin liên
    lạc, và ghi rõ "giả lập" nếu dữ liệu nhân thân là dữ liệu mô phỏng.
  legal_refs: []
  source: "finora-ai config/product_config.json (grades); docs/LEGAL-COMPLIANCE.md LEGAL-DISCLOSURE-02"
  version: CREDIT_POLICY_V1
  checked_at: "2026-10-15"
  keywords: ["hạng A", "hạng tín dụng", "xếp hạng khoản vay", "hồ sơ người vay", "điểm tín dụng", "xác suất vỡ nợ", "ẩn danh"]
