spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-blockchain
  datasource:
    url: ${BLOCKCHAIN_DB_URL:jdbc:postgresql://localhost:15435/finora_blockchain}
    username: ${BLOCKCHAIN_DB_USERNAME:finora_blockchain}
    password: ${BLOCKCHAIN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${BLOCKCHAIN_KAFKA_LISTENER_ENABLED:false}
    consumer:
      group-id: blockchain-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8083

finora:
  blockchain:
    proof:
      # MOCK chỉ phục vụ local/test và receipt luôn có tiền tố MOCK; Fabric thật fail-closed cho tới phase P4.
      provider: ${BLOCKCHAIN_PROOF_PROVIDER:MOCK}
      worker-enabled: ${BLOCKCHAIN_PROOF_WORKER_ENABLED:false}
      worker-delay: ${BLOCKCHAIN_PROOF_WORKER_DELAY:5000}
      batch-size: ${BLOCKCHAIN_PROOF_BATCH_SIZE:100}
      max-attempts: ${BLOCKCHAIN_PROOF_MAX_ATTEMPTS:10}
      retry-backoff: ${BLOCKCHAIN_PROOF_RETRY_BACKOFF:5s}
      maximum-backoff: ${BLOCKCHAIN_PROOF_MAXIMUM_BACKOFF:5m}
      processing-lease: ${BLOCKCHAIN_PROOF_PROCESSING_LEASE:2m}

# Hyperledger Fabric
fabric:
  channel-name: finora-channel
  chaincode-name: finora-ledger
  msp-id: Org1MSP
  # Các path này sẽ được cấu hình khi dựng mạng Fabric
  cert-path: ${FABRIC_CERT_PATH:./fabric-config/cert.pem}
  key-path: ${FABRIC_KEY_PATH:./fabric-config/key.pem}
  tls-cert-path: ${FABRIC_TLS_CERT_PATH:./fabric-config/tls-cert.pem}
  peer-endpoint: ${FABRIC_PEER_ENDPOINT:localhost:7051}
