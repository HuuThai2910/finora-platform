spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-loan
  datasource:
    # Neon/local đều truyền qua môi trường; repository không giữ host hoặc tài khoản triển khai mặc định.
    url: ${LOAN_DB_URL:jdbc:postgresql://ep-steep-fire-az704hm0-pooler.c-3.ap-southeast-1.aws.neon.tech/finora-loan?sslmode=require&channel_binding=require}
    username: ${LOAN_DB_USERNAME:neondb_owner}
    password: ${LOAN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cùng realm với finora-user: token do service đó cấp phải được Loan Service
          # chấp nhận. Chỉ cần khoá công khai để kiểm chữ ký, không cần client secret.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/finora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/finora/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Giới hạn cả thời gian chờ metadata trước khi KafkaTemplate trả future.
        max.block.ms: ${LOAN_KAFKA_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${LOAN_KAFKA_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${LOAN_KAFKA_DELIVERY_TIMEOUT_MS:10000}

server:
  port: 8081

# Swagger mặc định tắt để không công khai contract ngoài môi trường local.
springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics

finora:
  signature:
    # MOCK giữ luồng click-wrap phát triển. Chỉ đổi sang VNPT_SMART_CA khi đã có certificate và API contract.
    provider: ${FINORA_SIGNATURE_PROVIDER:MOCK}
    vnpt-smart-ca:
      # UAT Web API v1. Không đổi sang host production khi còn dùng fixed signer test.
      base-url: ${VNPT_SMARTCA_BASE_URL:https://rmgateway.vnptit.vn/sca/sp769}
      service-provider-id: ${VNPT_SMARTCA_SP_ID:}
      service-provider-password: ${VNPT_SMARTCA_SP_PASSWORD:}
      sandbox-fixed-signer-enabled: ${VNPT_SMARTCA_SANDBOX_FIXED_SIGNER_ENABLED:false}
      sandbox-user-id: ${VNPT_SMARTCA_SANDBOX_USER_ID:}
      sandbox-serial-number: ${VNPT_SMARTCA_SANDBOX_SERIAL_NUMBER:}
      connect-timeout: ${VNPT_SMARTCA_CONNECT_TIMEOUT:3s}
      read-timeout: ${VNPT_SMARTCA_READ_TIMEOUT:15s}
  loan:
    # Version này được snapshot khi borrower submit để đối chiếu đúng nội dung đã xác nhận.
    pricing-disclosure-version: ${LOAN_PRICING_DISCLOSURE_VERSION:RATE_DISCLOSURE_V2}
    interest-rate-unit: PERCENT_PER_YEAR
    rate-notice: "Lãi suất cơ sở dùng cho lịch ban đầu; lãi suất cuối có thể tăng hoặc giảm sau chấm điểm nhưng luôn nằm trong khoảng công bố. Nếu điều khoản cuối không bất lợi hơn, hồ sơ tự tiếp tục theo chấp thuận lúc nộp; nếu bất lợi hơn, người vay phải xác nhận lại trước khi lập hợp đồng."
    risk-pricing:
      policy-version: ${LOAN_RISK_PRICING_POLICY_VERSION:RISK_PRICING_V1}
      # Chốt an toàn cho mô hình P2P hiện tại; phạm vi pháp lý được giải thích trong docs/LEGAL-COMPLIANCE.md.
      legal-maximum-annual-rate: ${LOAN_LEGAL_MAXIMUM_ANNUAL_RATE:20.0000}
      grade-adjustments:
        A: ${LOAN_GRADE_A_RATE_ADJUSTMENT:-0.5000}
        B: ${LOAN_GRADE_B_RATE_ADJUSTMENT:0.0000}
        C: ${LOAN_GRADE_C_RATE_ADJUSTMENT:0.5000}
        D: ${LOAN_GRADE_D_RATE_ADJUSTMENT:1.0000}
        # Auto-reject không tính giá. Vẫn cấu hình E để an toàn nếu admin hạ ngưỡng và một hồ sơ E chuyển sang review.
        E: ${LOAN_GRADE_E_RATE_ADJUSTMENT:1.0000}
    contract:
      decision-policy-version: ${LOAN_DECISION_POLICY_VERSION:ADMIN_MANUAL_DECISION_V1}
      terms-version: ${LOAN_TERMS_VERSION:LOAN_TERMS_V1}
      # V2 thay chuỗi key=value kỹ thuật bằng văn bản tiếng Việt để borrower có thể đọc trước khi ký.
      document-version: ${LOAN_CONTRACT_DOCUMENT_VERSION:CLICK_WRAP_TEXT_V2}
      signature-window: ${LOAN_CONTRACT_SIGNATURE_WINDOW:7d}
      maximum-signature-window: ${LOAN_CONTRACT_MAXIMUM_SIGNATURE_WINDOW:30d}
      expiry-batch-size: ${LOAN_CONTRACT_EXPIRY_BATCH_SIZE:100}
      expiry-worker-enabled: ${LOAN_CONTRACT_EXPIRY_WORKER_ENABLED:true}
      expiry-worker-delay: ${LOAN_CONTRACT_EXPIRY_WORKER_DELAY:60000}
    outbox:
      batch-size: ${LOAN_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${LOAN_OUTBOX_MAX_ATTEMPTS:10}
      retry-backoff: ${LOAN_OUTBOX_RETRY_BACKOFF:5s}
      maximum-backoff: ${LOAN_OUTBOX_MAXIMUM_BACKOFF:5m}
      processing-lease: ${LOAN_OUTBOX_PROCESSING_LEASE:2m}
      # Mặc định chỉ ghi local outbox. Chỉ bật sau khi routes bên dưới đã được producer/consumer duyệt.
      publisher-enabled: ${LOAN_OUTBOX_PUBLISHER_ENABLED:false}
      publisher-delay: ${LOAN_OUTBOX_PUBLISHER_DELAY:5000}
      transport: ${LOAN_OUTBOX_TRANSPORT:none}
    kafka:
      publish-timeout: ${LOAN_KAFKA_PUBLISH_TIMEOUT:10s}
      # Không thêm route mặc định: tránh vô tình phát event nội bộ thành contract liên service.
      # Mỗi route phải gồm event-type, event-version và topic finora.loan.<past-event> đã đăng ký.
      routes: []
  borrower-eligibility:
    minimum-age: ${BORROWER_MINIMUM_AGE:18}
    maximum-age: ${BORROWER_MAXIMUM_AGE:65}
    policy-version: ${BORROWER_ELIGIBILITY_POLICY_VERSION:BORROWER_ELIGIBILITY_V1}
  ai:
    credit:
      base-url: ${AI_SERVICE_URL:http://localhost:8000}
      model-version: ${AI_CREDIT_MODEL_VERSION:17.0.0}
      connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
      read-timeout: ${AI_READ_TIMEOUT:15s}
      max-attempts: ${AI_MAX_ATTEMPTS:3}
      retry-backoff: ${AI_RETRY_BACKOFF:30s}
      worker-batch-size: ${AI_WORKER_BATCH_SIZE:10}
      worker-delay: ${AI_WORKER_DELAY:5000}
      worker-enabled: ${AI_WORKER_ENABLED:true}
      processing-lease: ${AI_PROCESSING_LEASE:2m}
  fineract:
    base-url: ${FINERACT_BASE_URL:http://localhost:18443/fineract-provider/api/v1}
    tenant-id: ${FINERACT_TENANT_ID:default}
    username: ${FINERACT_API_USERNAME}
    password: ${FINERACT_API_PASSWORD}
    preview-client-external-id: ${FINERACT_PREVIEW_CLIENT_EXTERNAL_ID:FINORA-PREVIEW-CLIENT}
    connect-timeout: ${FINERACT_CONNECT_TIMEOUT:3s}
    read-timeout: ${FINERACT_READ_TIMEOUT:10s}
    product-config-version: ${FINERACT_PRODUCT_CONFIG_VERSION:FINORA-FINERACT-V1}
    max-attempts: ${FINERACT_MAX_ATTEMPTS:3}
    retry-backoff: ${FINERACT_RETRY_BACKOFF:30s}
    retry-batch-size: ${FINERACT_RETRY_BATCH_SIZE:20}
    # Lease cho phép worker khác tiếp quản command nếu instance dừng giữa lúc gọi Fineract.
    processing-lease: ${FINERACT_PROCESSING_LEASE:2m}

resilience4j:
  circuitbreaker:
    instances:
      fineract-product:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # HTTP 4xx là sai credential/request, không phải sự cố tạm thời để mở circuit.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      fineract-schedule:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      ai-credit:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      fineract-product:
        # Cao hơn RestClient read-timeout để HTTP client tự phân loại timeout trước.
        timeout-duration: ${FINERACT_TIME_LIMITER_TIMEOUT:12s}
        cancel-running-future: true
      fineract-schedule:
        # Cao hơn RestClient read-timeout để HTTP client tự phân loại timeout trước.
        timeout-duration: ${FINERACT_TIME_LIMITER_TIMEOUT:12s}
        cancel-running-future: true
      ai-credit:
        # Cao hơn read-timeout 15 giây để HTTP client phân loại lỗi trước, nhưng vẫn chặn cuộc gọi bị treo.
        timeout-duration: ${AI_TIME_LIMITER_TIMEOUT:17s}
        cancel-running-future: true
