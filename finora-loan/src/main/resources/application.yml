spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-loan
  datasource:
    # Neon/local đều truyền qua môi trường; repository không giữ host hoặc tài khoản triển khai mặc định.
    url: ${LOAN_DB_URL:jdbc:postgresql://ep-steep-fire-az704hm0-pooler.c-3.ap-southeast-1.aws.neon.tech/finora-loan?sslmode=require&channel_binding=require}
    username: ${LOAN_DB_USERNAME:neondb_owner}
    password: ${LOAN_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

# Swagger mặc định tắt để không công khai contract ngoài môi trường local.
springdoc:
  api-docs:
    path: /api-docs
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics

