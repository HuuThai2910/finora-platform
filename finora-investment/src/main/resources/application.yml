spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-investment
  datasource:
    url: ${INVESTMENT_DB_URL:jdbc:postgresql://localhost:15437/finora_investment}
    username: ${INVESTMENT_DB_USERNAME:finora_investment}
    password: ${INVESTMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cùng realm với finora-user và finora-loan: token do finora-user cấp phải
          # được Investment Service chấp nhận. Chỉ cần khoá công khai để kiểm chữ ký.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/finora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/finora/protocol/openid-connect/certs}

server:
  port: 8084

logging:
  level:
    com.finora.investment: INFO


