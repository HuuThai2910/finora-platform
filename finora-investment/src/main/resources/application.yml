spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-investment
  datasource:
    url: ${INVESTMENT_DB_URL}
    username: ${INVESTMENT_DB_USERNAME}
    password: ${INVESTMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cùng realm với finora-user và finora-loan: token do finora-user cấp phải
          # được Investment Service chấp nhận. Chỉ cần khoá công khai để kiểm chữ ký.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/finora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/finora/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${INVESTMENT_LOAN_FUNDING_GROUP:investment-loan-funding}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

server:
  port: 8084

management:
  endpoint:
    health:
      # Ai cũng thấy tên và trạng thái từng thành phần; chi tiết chỉ hiện với token ROLE_ADMIN (W3E, D56).
      show-components: always
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
      group:
        # Liveness chỉ hỏi JVM còn chạy; dependency lỗi không được làm orchestrator khởi động lại Investment.
        liveness:
          include: livenessState
        # Sàn, lệnh và Note đều cần PostgreSQL. Kafka không vào đây: outbox giữ event trong DB khi broker tắt.
        readiness:
          include: readinessState,db
        operations:
          include: kafka
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.finora.investment: INFO

finora:
  # Pin-token xác nhận thao tác nhạy cảm — khoá HS256 phải GIỐNG NHAU ở finora-user
  # (bên cấp) và payment/investment/loan (bên kiểm). Mặc định chỉ dùng cho máy dev.
  pin:
    token-secret: ${FINORA_PIN_TOKEN_SECRET:dev-only-pin-token-secret-change-me-32b}
    token-ttl: ${FINORA_PIN_TOKEN_TTL:PT3M}
  investment:
    # Chặn đặt lệnh/bật Auto-Invest khi token chưa có claim ekyc_status=VERIFIED. Realm đang chạy
    # phải có mapper ekyc-status (docker/keycloak/add-ekyc-claim-mapper.sh) rồi đăng nhập lại.
    require-ekyc: ${INVESTMENT_REQUIRE_EKYC:true}
    # D6/LEGAL-DISCLOSURE-02: version công bố rủi ro nhà đầu tư phải xác nhận trước lệnh sơ cấp; đổi nội dung thì tăng version.
    risk-disclosure:
      version: ${INVESTMENT_RISK_DISCLOSURE_VERSION:INVESTOR_RISK_V1}
    payment:
      mode: ${INVESTMENT_PAYMENT_MODE:http}
      base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082/api/v1}
    # Họ tên + CCCD đã che in lên giấy xác nhận chuyển nhượng; service account cần client role
    # user:identity:read_internal (docker/keycloak/add-investment-client.sh).
    user:
      mode: ${INVESTMENT_USER_MODE:http}
      base-url: ${USER_SERVICE_URL:http://localhost:8085}
    # Service account cho lời gọi Payment không có JWT người dùng (Auto-Invest giữ tiền thay
    # nhà đầu tư). Client mang client role payment:hold:on_behalf.
    service-account:
      token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/finora/protocol/openid-connect/token}
      client-id: ${KEYCLOAK_INVESTMENT_CLIENT_ID:finora-investment-client}
      client-secret: ${KEYCLOAK_INVESTMENT_CLIENT_SECRET:}
    # Sổ lệnh Ask/Bid chợ thứ cấp (INV-E2). Worker thanh toán gọi Payment chuyển tiền từ phần
    # đang giữ của lệnh mua sang người bán, rồi nhả phần giữ thừa khi lệnh mua kết thúc.
    order-book:
      stream-timeout-ms: ${INVESTMENT_ORDER_BOOK_STREAM_TIMEOUT_MS:1800000}
      heartbeat-ms: ${INVESTMENT_ORDER_BOOK_HEARTBEAT_MS:20000}
      settlement:
        enabled: ${INVESTMENT_ORDER_BOOK_SETTLEMENT_ENABLED:true}
        delay: ${INVESTMENT_ORDER_BOOK_SETTLEMENT_DELAY:2000}
        batch-size: ${INVESTMENT_ORDER_BOOK_SETTLEMENT_BATCH_SIZE:50}
        retry-backoff: ${INVESTMENT_ORDER_BOOK_SETTLEMENT_RETRY_BACKOFF:5s}
        maximum-backoff: ${INVESTMENT_ORDER_BOOK_SETTLEMENT_MAXIMUM_BACKOFF:5m}
    # Giấy xác nhận chuyển nhượng Note: worker lập PDF cho lần khớp đã thanh toán, đóng dấu số FINORA rồi phát
    # NoteTransferDocumentIssued để Blockchain neo hash. Không có keystore thì dùng con dấu demo (không giá trị pháp lý).
    transfer-document:
      enabled: ${INVESTMENT_TRANSFER_DOCUMENT_ENABLED:true}
      delay: ${INVESTMENT_TRANSFER_DOCUMENT_DELAY:10000}
      batch-size: ${INVESTMENT_TRANSFER_DOCUMENT_BATCH_SIZE:20}
      max-attempts: ${INVESTMENT_TRANSFER_DOCUMENT_MAX_ATTEMPTS:8}
      retry-backoff: ${INVESTMENT_TRANSFER_DOCUMENT_RETRY_BACKOFF:30s}
      maximum-backoff: ${INVESTMENT_TRANSFER_DOCUMENT_MAXIMUM_BACKOFF:30m}
      processing-lease: ${INVESTMENT_TRANSFER_DOCUMENT_PROCESSING_LEASE:2m}
      seal:
        keystore-path: ${INVESTMENT_TRANSFER_DOCUMENT_SEAL_KEYSTORE:}
        keystore-password: ${INVESTMENT_TRANSFER_DOCUMENT_SEAL_PASSWORD:}
        key-alias: ${INVESTMENT_TRANSFER_DOCUMENT_SEAL_ALIAS:}
    # Đối soát định kỳ: đóng listing hết hạn gọi vốn, làm tiếp/huỷ lệnh kẹt chờ giữ tiền quá
    # pending-funds-timeout, nhả khoản giữ còn treo, huỷ lệnh trong sổ của khoản vay đã tất toán.
    maintenance:
      enabled: ${INVESTMENT_MAINTENANCE_ENABLED:true}
      delay: ${INVESTMENT_MAINTENANCE_DELAY:30000}
      batch-size: ${INVESTMENT_MAINTENANCE_BATCH_SIZE:50}
      pending-funds-timeout: ${INVESTMENT_PENDING_FUNDS_TIMEOUT:2m}
    auto-invest:
      enabled: ${INVESTMENT_AUTO_INVEST_ENABLED:true}
      delay: ${INVESTMENT_AUTO_INVEST_DELAY:5000}
      batch-size: ${INVESTMENT_AUTO_INVEST_BATCH_SIZE:20}
    kafka:
      funding-requested-topic: ${LOAN_FUNDING_REQUESTED_TOPIC:finora.loan.funding-requested}
      funding-cancelled-topic: ${LOAN_FUNDING_CANCELLED_TOPIC:finora.loan.funding-cancelled}
      fully-funded-topic: ${INVESTMENT_FULLY_FUNDED_TOPIC:finora.investment.loan-fully-funded}
      funding-expired-topic: ${INVESTMENT_FUNDING_EXPIRED_TOPIC:finora.investment.loan-funding-expired}
      investor-signature-requested-topic: ${LOAN_INVESTOR_SIGNATURE_REQUESTED_TOPIC:finora.loan.investor-signature-requested}
      contract-activated-topic: ${LOAN_CONTRACT_ACTIVATED_TOPIC:finora.loan.contract-activated}
      loan-disbursed-topic: ${LOAN_DISBURSED_TOPIC:finora.loan.disbursed}
      note-ownership-changed-topic: ${INVESTMENT_NOTE_OWNERSHIP_CHANGED_TOPIC:finora.investment.note-ownership-changed}
      note-servicing-changed-topic: ${INVESTMENT_NOTE_SERVICING_CHANGED_TOPIC:finora.investment.note-servicing-changed}
      reschedule-consent-requested-topic: ${LOAN_RESCHEDULE_CONSENT_REQUESTED_TOPIC:finora.loan.reschedule-consent-requested}
      reschedule-consent-completed-topic: ${INVESTMENT_RESCHEDULE_CONSENT_COMPLETED_TOPIC:finora.investment.reschedule-consent-completed}
      note-transfer-document-issued-topic: ${INVESTMENT_NOTE_TRANSFER_DOCUMENT_ISSUED_TOPIC:finora.investment.note-transfer-document-issued}
      repayment-distributed-topic: ${PAYMENT_REPAYMENT_DISTRIBUTED_TOPIC:finora.payment.repayment-distributed}
      loan-settled-topic: ${LOAN_SETTLED_TOPIC:finora.loan.settled}
      loan-rescheduled-topic: ${LOAN_RESCHEDULED_TOPIC:finora.loan.rescheduled}
      loan-delinquency-changed-topic: ${LOAN_DELINQUENCY_CHANGED_TOPIC:finora.loan.delinquency-changed}
      publish-timeout: ${INVESTMENT_KAFKA_PUBLISH_TIMEOUT:10s}
    outbox:
      publisher-delay: ${INVESTMENT_OUTBOX_PUBLISHER_DELAY:5000}
      batch-size: ${INVESTMENT_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${INVESTMENT_OUTBOX_MAX_ATTEMPTS:10}
      retry-backoff: ${INVESTMENT_OUTBOX_RETRY_BACKOFF:5s}
      maximum-backoff: ${INVESTMENT_OUTBOX_MAXIMUM_BACKOFF:5m}
      processing-lease: ${INVESTMENT_OUTBOX_PROCESSING_LEASE:2m}
