spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-investment
  datasource:
    url: ${INVESTMENT_DB_URL:jdbc:postgresql://localhost:15437/finora_investment}
    username: ${INVESTMENT_DB_USERNAME:finora_investment}
    password: ${INVESTMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8084
