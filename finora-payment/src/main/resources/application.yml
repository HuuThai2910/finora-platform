spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-payment
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:15434/finora_payment}
    username: ${PAYMENT_DB_USERNAME:finora_payment}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${PAYMENT_KAFKA_LISTENER_ENABLED:true}
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST:localhost}
      port: ${PAYMENT_REDIS_PORT:6380}
      password: ${PAYMENT_REDIS_PASSWORD}
      repositories:
        enabled: false

server:
  port: 8082

finora:
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    mock:
      outcome: ${PAYMENT_MOCK_OUTCOME:success}
    disbursement-requested-topic: ${LOAN_DISBURSEMENT_REQUESTED_TOPIC:finora.loan.disbursement-requested}
    disbursement-completed-topic: ${PAYMENT_DISBURSEMENT_COMPLETED_TOPIC:finora.payment.disbursement-completed}
    disbursement-failed-topic: ${PAYMENT_DISBURSEMENT_FAILED_TOPIC:finora.payment.disbursement-failed}
    worker-delay: ${PAYMENT_DISBURSEMENT_WORKER_DELAY:3000}
    outbox-delay: ${PAYMENT_OUTBOX_DELAY:3000}
