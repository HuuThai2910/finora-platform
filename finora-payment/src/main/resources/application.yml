spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: finora-payment
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:15434/finora_payment}
    username: ${PAYMENT_DB_USERNAME:finora_payment}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST:localhost}
      port: ${PAYMENT_REDIS_PORT:6380}
      password: ${PAYMENT_REDIS_PASSWORD}

server:
  port: 8082
